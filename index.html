<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remy AI - Restaurant Tracker</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',system-ui,sans-serif; background:#09090b; color:#fafafa; min-height:100vh; }
        ::-webkit-scrollbar { width:8px; }
        ::-webkit-scrollbar-track { background:#18181b; }
        ::-webkit-scrollbar-thumb { background:#3f3f46; border-radius:4px; }
    </style>
</head>
<body>
    <div id="login-overlay" style="position:fixed;inset:0;background:#09090b;display:flex;align-items:center;justify-content:center;z-index:9999;">
        <div style="text-align:center;">
            <div style="font-size:48px;margin-bottom:16px;">🐀</div>
            <div style="color:#f97316;font-size:20px;font-weight:600;margin-bottom:24px;">Remy CRM</div>
            <input type="password" id="password-input" placeholder="Digite a senha..." style="background:#27272a;border:1px solid #3f3f46;border-radius:6px;padding:12px 16px;color:#fff;font-size:14px;width:240px;outline:none;text-align:center;" autofocus />
            <div id="login-error" style="color:#ef4444;font-size:12px;margin-top:12px;display:none;">Senha incorreta</div>
        </div>
    </div>
    <script>
        const correctPassword = "remy4thewin";
        const overlay = document.getElementById('login-overlay');
        const input = document.getElementById('password-input');
        const error = document.getElementById('login-error');
        
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                if (input.value === correctPassword) {
                    overlay.style.display = 'none';
                } else {
                    error.style.display = 'block';
                    input.value = '';
                    input.style.borderColor = '#ef4444';
                }
            }
        });
    </script>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // ========== GOOGLE SHEETS CONFIGURATION ==========
        // PASTE YOUR GOOGLE APPS SCRIPT URL HERE (the one ending in /exec):
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx-NKkawVYcTqBmDKUI6vyPY6zmQWf7Dgli57o4oWzOup_Pa8h7sQmcq6PgZ5ELNvc/exec';
        
        // API Helper Functions for Google Sheets
        const sheetsAPI = {
            async loadAll() {
                if (GOOGLE_SCRIPT_URL === 'YOUR_GOOGLE_SCRIPT_URL_HERE') {
                    throw new Error('Please configure your Google Script URL on line 26');
                }
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getAll`, {
                    method: 'GET',
                    redirect: 'follow'
                });
                const text = await response.text();
                const result = JSON.parse(text);
                if (result.success) return result.data;
                throw new Error(result.error || 'Failed to load data');
            },
            
            async saveRestaurant(restaurant) {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    body: JSON.stringify({ action: 'saveRestaurant', restaurant })
                });
                const text = await response.text();
                const result = JSON.parse(text);
                if (!result.success) throw new Error(result.error);
                return result;
            },
            
            async deleteRestaurant(id) {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    body: JSON.stringify({ action: 'deleteRestaurant', id })
                });
                const text = await response.text();
                const result = JSON.parse(text);
                if (!result.success) throw new Error(result.error);
                return result;
            },
            
            async saveContact(contact) {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    body: JSON.stringify({ action: 'saveContact', contact })
                });
                const text = await response.text();
                const result = JSON.parse(text);
                if (!result.success) throw new Error(result.error);
                return result;
            },
            
            async deleteContact(id) {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    body: JSON.stringify({ action: 'deleteContact', id })
                });
                const text = await response.text();
                const result = JSON.parse(text);
                if (!result.success) throw new Error(result.error);
                return result;
            },
            
            async syncAll(restaurants, contacts) {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    body: JSON.stringify({ action: 'syncAll', restaurants, contacts })
                });
                const text = await response.text();
                const result = JSON.parse(text);
                if (result.success) return result.data;
                throw new Error(result.error);
            }
        };
            
        // Stage configuration with time targets and conversion rates
        const STAGES = [
            { id: 'identified', name: 'Identified', color: '#6b7280', targetDays: 14, conversionRate: 0.15 },
            { id: 'conv1_scheduled', name: 'Call 1 Scheduled', color: '#8b5cf6', targetDays: 7, conversionRate: 0.25 },
            { id: 'conv1_done', name: 'Call 1 Done', color: '#a78bfa', targetDays: 7, conversionRate: 0.30 },
            { id: 'conv2_scheduled', name: 'Call 2 Scheduled', color: '#3b82f6', targetDays: 7, conversionRate: 0.35 },
            { id: 'conv2_done', name: 'Call 2 Done', color: '#60a5fa', targetDays: 7, conversionRate: 0.40 },
            { id: 'proposal_sent', name: 'Proposal Sent', color: '#f59e0b', targetDays: 21, conversionRate: 0.50 },
            { id: 'proposal_accepted', name: 'Accepted', color: '#22c55e', targetDays: 7, conversionRate: 0.85 },
            { id: 'trial', name: 'Trial', color: '#14b8a6', targetDays: 20, conversionRate: 0.85 },
            { id: 'won', name: 'Live Client', color: '#10b981', targetDays: 0, conversionRate: 1 },
            { id: 'lost', name: 'Lost', color: '#dc2626', targetDays: 0, conversionRate: 0 },
            { id: 'passive', name: 'Passive', color: '#9ca3af', targetDays: 0, conversionRate: 0 }
        ];

        // Pipeline stages (active deals only - for Kanban)
        const PIPELINE_STAGES = STAGES.filter(s => 
            !['identified', 'won', 'lost', 'passive'].includes(s.id)
        );

        // All active stages (including identified, excluding end states)
        const ACTIVE_STAGES = STAGES.filter(s => 
            !['won', 'lost', 'passive'].includes(s.id)
        );

        const BOOKING_SYSTEMS = ['OpenTable', 'Resy', 'SevenRooms', 'TheFork', 'ResDiary', 'Quandoo', 'Tablein', 'Phone Only', 'Other'];

        // Icons
        const Icon = ({ name, size = 18 }) => {
            const icons = {
                home: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
                list: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>,
                pipeline: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>,
                plus: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
                search: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
                edit: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
                trash: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
                x: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
                phone: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>,
                mail: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>,
                globe: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>,
                users: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
                calendar: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
                check: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 17 4 12"/></svg>,
                upload: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
                download: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
                note: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>,
                refresh: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>,
                cloud: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>,
                alert: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
                dollar: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
                clock: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
                target: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
                trendUp: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
            };
            return icons[name] || null;
        };

        // Utility functions for pipeline calculations
        const getDaysInStage = (restaurant) => {
            if (!restaurant.stageEnteredDate) return null;
            const entered = new Date(restaurant.stageEnteredDate);
            const now = new Date();
            return Math.floor((now - entered) / (1000 * 60 * 60 * 24));
        };

        const getAgingStatus = (restaurant) => {
            const stage = STAGES.find(s => s.id === restaurant.stage);
            if (!stage || stage.targetDays === 0) return 'normal';
            const days = getDaysInStage(restaurant);
            if (days === null) return 'unknown';
            if (days > stage.targetDays * 1.5) return 'overdue';
            if (days > stage.targetDays) return 'warning';
            return 'normal';
        };

        const getContractValue = (restaurant) => {
            const fee = parseFloat(restaurant.targetMonthlyFee) || 0;
            return fee * 12;
        };

        const getPipelineValue = (restaurants) => {
            return restaurants
                .filter(r => !['lost', 'won', 'passive'].includes(r.stage))
                .reduce((sum, r) => sum + getContractValue(r), 0);
        };

        const getWeightedPipelineValue = (restaurants) => {
            return restaurants
                .filter(r => !['lost', 'won', 'passive'].includes(r.stage))
                .reduce((sum, r) => {
                    const stage = STAGES.find(s => s.id === r.stage);
                    const value = getContractValue(r);
                    return sum + (value * (stage?.conversionRate || 0));
                }, 0);
        };

        const formatCurrency = (amount) => {
            return new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(amount);
        };

        // Styled components via inline styles
        const styles = {
            app: { display: 'flex', minHeight: '100vh' },
            sidebar: { width: 220, background: '#18181b', borderRight: '1px solid #27272a', display: 'flex', flexDirection: 'column', position: 'fixed', height: '100vh' },
            logo: { padding: '20px 16px', borderBottom: '1px solid #27272a' },
            logoText: { fontSize: 20, fontWeight: 700, color: '#f97316', display: 'flex', alignItems: 'center', gap: 8 },
            nav: { padding: '12px 8px', flex: 1 },
            navItem: { display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', borderRadius: 6, cursor: 'pointer', color: '#a1a1aa', fontSize: 14, fontWeight: 500, marginBottom: 4, transition: 'all 0.15s' },
            navItemActive: { background: 'rgba(249,115,22,0.15)', color: '#f97316' },
            main: { flex: 1, marginLeft: 220 },
            header: { padding: '16px 24px', borderBottom: '1px solid #27272a', display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: '#18181b', position: 'sticky', top: 0, zIndex: 10 },
            pageTitle: { fontSize: 20, fontWeight: 600 },
            searchBox: { display: 'flex', alignItems: 'center', gap: 8, background: '#27272a', borderRadius: 6, padding: '8px 12px', width: 260 },
            searchInput: { flex: 1, background: 'none', border: 'none', outline: 'none', color: '#fff', fontSize: 14 },
            btn: { display: 'inline-flex', alignItems: 'center', gap: 6, padding: '8px 16px', borderRadius: 6, fontSize: 14, fontWeight: 500, cursor: 'pointer', border: 'none', transition: 'all 0.15s' },
            btnPrimary: { background: '#f97316', color: '#fff' },
            btnSecondary: { background: '#27272a', color: '#fff', border: '1px solid #3f3f46' },
            content: { padding: 24 },
            grid: { display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 16, marginBottom: 24 },
            statCard: { background: '#18181b', border: '1px solid #27272a', borderRadius: 10, padding: 20 },
            statValue: { fontSize: 32, fontWeight: 700, marginBottom: 4 },
            statLabel: { fontSize: 13, color: '#71717a' },
            card: { background: '#18181b', border: '1px solid #27272a', borderRadius: 10, overflow: 'hidden' },
            cardHeader: { padding: '16px 20px', borderBottom: '1px solid #27272a', display: 'flex', alignItems: 'center', justifyContent: 'space-between' },
            cardTitle: { fontSize: 15, fontWeight: 600 },
            table: { width: '100%', borderCollapse: 'collapse' },
            th: { textAlign: 'left', padding: '12px 16px', fontSize: 11, fontWeight: 600, textTransform: 'uppercase', letterSpacing: 0.5, color: '#71717a', background: '#1f1f23', borderBottom: '1px solid #27272a' },
            td: { padding: '14px 16px', fontSize: 14, borderBottom: '1px solid #27272a', verticalAlign: 'middle' },
            badge: { display: 'inline-flex', alignItems: 'center', gap: 6, padding: '4px 10px', borderRadius: 20, fontSize: 12, fontWeight: 500 },
            modal: { position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.8)', display: 'flex', alignItems: 'flex-start', justifyContent: 'center', padding: '40px 20px', zIndex: 100, overflowY: 'auto' },
            modalContent: { background: '#18181b', border: '1px solid #27272a', borderRadius: 12, width: '100%', maxWidth: 640 },
            modalHeader: { padding: '20px 24px', borderBottom: '1px solid #27272a', display: 'flex', alignItems: 'center', justifyContent: 'space-between' },
            modalBody: { padding: 24 },
            modalFooter: { padding: '16px 24px', borderTop: '1px solid #27272a', display: 'flex', justifyContent: 'flex-end', gap: 12 },
            formGrid: { display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 16 },
            formGroup: { display: 'flex', flexDirection: 'column', gap: 6 },
            formLabel: { fontSize: 13, fontWeight: 500, color: '#a1a1aa' },
            formInput: { background: '#27272a', border: '1px solid #3f3f46', borderRadius: 6, padding: '10px 12px', color: '#fff', fontSize: 14, outline: 'none' },
            formSection: { marginBottom: 24 },
            formSectionTitle: { fontSize: 13, fontWeight: 600, color: '#f97316', marginBottom: 12, paddingBottom: 8, borderBottom: '1px solid #27272a' },
        };

        // Stage Badge Component
        const StageBadge = ({ stage }) => {
            const stageInfo = STAGES.find(s => s.id === stage) || STAGES[0];
            return (
                <span style={{ ...styles.badge, background: `${stageInfo.color}22`, color: stageInfo.color }}>
                    <span style={{ width: 6, height: 6, borderRadius: '50%', background: stageInfo.color }}></span>
                    {stageInfo.name}
                </span>
            );
        };

        // Dashboard Component
        const Dashboard = ({ restaurants, onEdit, onAddNote }) => {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const [selectedRestaurant, setSelectedRestaurant] = useState('');
            const [quickNote, setQuickNote] = useState('');
            
            const stats = useMemo(() => ({
                total: restaurants.length,
                won: restaurants.filter(r => r.stage === 'won').length,
                pipeline: restaurants.filter(r => !['won', 'passive', 'identified', 'lost'].includes(r.stage)).length,
                needsAction: restaurants.filter(r => {
                    if (r.stage === 'won' || r.stage === 'passive' || r.stage === 'lost') return false;
                    if (!r.nextContact) return true;
                    const nextDate = new Date(r.nextContact);
                    return nextDate <= today;
                }).length,
                lost: restaurants.filter(r => r.stage === 'lost').length
            }), [restaurants]);

            const priorityActions = useMemo(() => 
                restaurants
                    .filter(r => r.stage !== 'won' && r.stage !== 'passive' && r.stage !== 'lost' && r.nextContact)
                    .map(r => {
                        const nextDate = new Date(r.nextContact);
                        const diffTime = nextDate - today;
                        const daysUntil = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        const isOverdue = daysUntil < 0;
                        const priority = isOverdue ? 'high' : daysUntil <= 2 ? 'medium' : 'low';
                        return { ...r, daysUntil, priority, isOverdue };
                    })
                    .sort((a, b) => a.daysUntil - b.daysUntil)
                    .slice(0, 5)
            , [restaurants]);
            
            const handleAddQuickNote = () => {
                if (!selectedRestaurant || !quickNote.trim()) return;
                onAddNote(selectedRestaurant, quickNote.trim());
                setQuickNote('');
            };
            
            // Get recent notes from selected restaurant
            const selectedRestaurantData = restaurants.find(r => r.id === selectedRestaurant);
            const recentNotes = selectedRestaurantData?.notesHistory?.slice(-3).reverse() || [];

            return (
                <div>
                    {/* Quick Notes Section - Full Width at Top */}
                    <div style={{ ...styles.card, marginBottom: 24 }}>
                        <div style={styles.cardHeader}>
                            <span style={styles.cardTitle}>⚡ Quick Notes</span>
                        </div>
                        <div style={{ padding: 16 }}>
                            <div style={{ display: 'flex', gap: 12, marginBottom: 12 }}>
                                <select 
                                    style={{ ...styles.formInput, flex: '0 0 250px' }} 
                                    value={selectedRestaurant} 
                                    onChange={e => setSelectedRestaurant(e.target.value)}
                                >
                                    <option value="">Select restaurant...</option>
                                    {[...restaurants].sort((a, b) => a.name.localeCompare(b.name)).map(r => (
                                        <option key={r.id} value={r.id}>{r.name}</option>
                                    ))}
                                </select>
                                <input 
                                    style={{ ...styles.formInput, flex: 1 }} 
                                    value={quickNote} 
                                    onChange={e => setQuickNote(e.target.value)}
                                    placeholder={selectedRestaurant ? "Type your note and press Enter..." : "Select a restaurant first..."}
                                    disabled={!selectedRestaurant}
                                    onKeyPress={e => {
                                        if (e.key === 'Enter' && quickNote.trim()) {
                                            handleAddQuickNote();
                                        }
                                    }}
                                />
                                <button 
                                    style={{ ...styles.btn, ...styles.btnPrimary, opacity: (!selectedRestaurant || !quickNote.trim()) ? 0.5 : 1 }}
                                    onClick={handleAddQuickNote}
                                    disabled={!selectedRestaurant || !quickNote.trim()}
                                >
                                    <Icon name="plus" size={16} /> Add Note
                                </button>
                            </div>

                                            const proposals = restaurants.filter(r => ['proposal_sent', 'proposal_accepted', 'trial', 'won'].includes(r.stage)).length;

        // Pipeline Visualization Component
        const PipelineView = ({ restaurants, onEdit, onStageChange }) => {
            const [filters, setFilters] = useState({
                minTables: '',
                maxTables: '',
                nextContactBefore: '',
                trialDateAfter: '',
                showOverdueOnly: false
            });
            const [draggedItem, setDraggedItem] = useState(null);

            // Filter restaurants
            const filteredRestaurants = useMemo(() => {
                return restaurants.filter(r => {
                    // Only show active pipeline (not identified, won, lost, passive)
                    if (['identified', 'lost', 'won', 'passive'].includes(r.stage)) return false;
                    
                    // Apply filters
                    if (filters.minTables && (parseInt(r.tables) || 0) < parseInt(filters.minTables)) return false;
                    if (filters.maxTables && (parseInt(r.tables) || 0) > parseInt(filters.maxTables)) return false;
                    if (filters.nextContactBefore && r.nextContact && r.nextContact > filters.nextContactBefore) return false;
                    if (filters.trialDateAfter && r.trialDate && r.trialDate < filters.trialDateAfter) return false;
                    if (filters.showOverdueOnly && getAgingStatus(r) !== 'overdue') return false;
                    
                    return true;
                });
            }, [restaurants, filters]);

            // Calculate pipeline metrics
            const metrics = useMemo(() => {
                const active = restaurants.filter(r => !['lost', 'won', 'passive'].includes(r.stage));
                const pipelineDeals = restaurants.filter(r => !['identified', 'lost', 'won', 'passive'].includes(r.stage));
                
                const totalValue = getPipelineValue(restaurants);
                const weightedValue = getWeightedPipelineValue(restaurants);
                
                const overdueCount = pipelineDeals.filter(r => getAgingStatus(r) === 'overdue').length;
                const warningCount = pipelineDeals.filter(r => getAgingStatus(r) === 'warning').length;
                
                // Average days in stage by stage
                const stageMetrics = PIPELINE_STAGES.map(stage => {
                    const stageDeals = pipelineDeals.filter(r => r.stage === stage.id);
                    const daysInStage = stageDeals.map(r => getDaysInStage(r)).filter(d => d !== null);
                    const avgDays = daysInStage.length > 0 ? Math.round(daysInStage.reduce((a, b) => a + b, 0) / daysInStage.length) : 0;
                    const stageValue = stageDeals.reduce((sum, r) => sum + getContractValue(r), 0);
                    return {
                        ...stage,
                        count: stageDeals.length,
                        avgDays,
                        value: stageValue,
                        weightedValue: stageValue * stage.conversionRate
                    };
                });

                return { totalValue, weightedValue, overdueCount, warningCount, stageMetrics, pipelineCount: pipelineDeals.length };
            }, [restaurants]);

            // 6-month forecast with confidence bands
            const forecast = useMemo(() => {
                const months = [];
                const today = new Date();
                
                // Define confidence categories
                const COMMIT_STAGES = ['proposal_accepted', 'trial']; // 85% probability
                const BEST_CASE_STAGES = ['proposal_sent']; // 50% probability  
                const PIPELINE_STAGES_IDS = ['conv1_scheduled', 'conv1_done', 'conv2_scheduled', 'conv2_done']; // 25-40%
                const UPSIDE_STAGES = ['identified']; // 15%
                
                let cumulativeCommit = 0;
                let cumulativeBestCase = 0;
                let cumulativePipeline = 0;
                
                for (let i = 0; i < 6; i++) {
                    const monthDate = new Date(today.getFullYear(), today.getMonth() + i, 1);
                    const monthEnd = new Date(today.getFullYear(), today.getMonth() + i + 1, 0);
                    const monthName = monthDate.toLocaleDateString('en-GB', { month: 'short', year: '2-digit' });
                    
                    let commitValue = 0;
                    let bestCaseValue = 0;
                    let pipelineValue = 0;
                    let upsideValue = 0;
                    let dealCount = 0;
                    
                    // Breakdown by stage for this month
                    const stageBreakdown = {};
                    
                    restaurants.forEach(r => {
                        if (['lost', 'won', 'passive'].includes(r.stage)) return;
                        
                        const stage = STAGES.find(s => s.id === r.stage);
                        if (!stage) return;
                        
                        const daysInStage = getDaysInStage(r) || 0;
                        const remainingDays = Math.max(0, 90 - daysInStage);
                        const expectedCloseDate = new Date(today.getTime() + remainingDays * 24 * 60 * 60 * 1000);
                        
                        if (expectedCloseDate >= monthDate && expectedCloseDate <= monthEnd) {
                            const contractValue = getContractValue(r);
                            
                            // Categorize by confidence level
                            if (COMMIT_STAGES.includes(r.stage)) {
                                commitValue += contractValue * 0.85;
                            } else if (BEST_CASE_STAGES.includes(r.stage)) {
                                bestCaseValue += contractValue * 0.50;
                            } else if (PIPELINE_STAGES_IDS.includes(r.stage)) {
                                pipelineValue += contractValue * stage.conversionRate;
                            } else if (UPSIDE_STAGES.includes(r.stage)) {
                                upsideValue += contractValue * 0.15;
                            }
                            
                            dealCount += stage.conversionRate;
                            
                            // Track by stage for breakdown
                            if (!stageBreakdown[r.stage]) {
                                stageBreakdown[r.stage] = { value: 0, count: 0, color: stage.color };
                            }
                            stageBreakdown[r.stage].value += contractValue * stage.conversionRate;
                            stageBreakdown[r.stage].count++;
                        }
                    });
                    
                    cumulativeCommit += commitValue;
                    cumulativeBestCase += commitValue + bestCaseValue;
                    cumulativePipeline += commitValue + bestCaseValue + pipelineValue;
                    
                    months.push({ 
                        month: monthName, 
                        commit: Math.round(commitValue),
                        bestCase: Math.round(bestCaseValue),
                        pipeline: Math.round(pipelineValue),
                        upside: Math.round(upsideValue),
                        total: Math.round(commitValue + bestCaseValue + pipelineValue + upsideValue),
                        weighted: Math.round(commitValue + bestCaseValue + pipelineValue),
                        cumulativeCommit: Math.round(cumulativeCommit),
                        cumulativeBestCase: Math.round(cumulativeBestCase),
                        cumulativePipeline: Math.round(cumulativePipeline),
                        deals: Math.round(dealCount * 10) / 10,
                        stageBreakdown
                    });
                }
                
                return months;
            }, [restaurants]);

            // Drag and drop handlers
            const handleDragStart = (e, restaurant) => {
                setDraggedItem(restaurant);
                e.dataTransfer.effectAllowed = 'move';
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
            };

            const handleDrop = (e, newStage) => {
                e.preventDefault();
                if (draggedItem && draggedItem.stage !== newStage) {
                    onStageChange(draggedItem.id, newStage);
                }
                setDraggedItem(null);
            };

            const handleDragEnd = () => {
                setDraggedItem(null);
            };

            return (
                <div>
                    {/* Summary Cards */}
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16, marginBottom: 24 }}>

                                <span style={{ fontSize: 13, color: '#71717a' }}>Pipeline Value</span>
                            </div>
                            <div style={{ fontSize: 28, fontWeight: 700, color: '#3b82f6' }}>{formatCurrency(metrics.totalValue)}</div>
                            <div style={{ fontSize: 12, color: '#71717a' }}>{metrics.pipelineCount} deals</div>
                        </div>
                        <div style={styles.statCard}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
                                <Icon name="target" size={20} />
                                <span style={{ fontSize: 13, color: '#71717a' }}>Weighted Value</span>
                            </div>
                            <div style={{ fontSize: 28, fontWeight: 700, color: '#10b981' }}>{formatCurrency(metrics.weightedValue)}</div>
                            <div style={{ fontSize: 12, color: '#71717a' }}>Probability adjusted</div>
                        </div>
                        <div style={styles.statCard}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
                                <Icon name="alert" size={20} />
                                <span style={{ fontSize: 13, color: '#71717a' }}>Needs Attention</span>
                            </div>
                            <div style={{ fontSize: 28, fontWeight: 700, color: metrics.overdueCount > 0 ? '#ef4444' : '#22c55e' }}>
                                {metrics.overdueCount}
                            </div>
                            <div style={{ fontSize: 12, color: '#71717a' }}>{metrics.warningCount} approaching</div>
                        </div>
                        <div style={styles.statCard}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
                                <Icon name="trendUp" size={20} />
                                <span style={{ fontSize: 13, color: '#71717a' }}>Next Month Forecast</span>
                            </div>
                            <div style={{ fontSize: 28, fontWeight: 700, color: '#f59e0b' }}>{formatCurrency(forecast[0]?.weighted || 0)}</div>
                            <div style={{ fontSize: 12, color: '#71717a' }}>~{forecast[0]?.deals || 0} expected closes</div>
                        </div>
                    </div>

                    {/* Filters */}
                    <div style={{ ...styles.card, marginBottom: 24 }}>
                        <div style={{ padding: 16, display: 'flex', gap: 16, alignItems: 'center', flexWrap: 'wrap' }}>
                            <span style={{ fontSize: 13, fontWeight: 600, color: '#a1a1aa' }}>Filters:</span>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                <span style={{ fontSize: 12, color: '#71717a' }}>Tables:</span>
                                <input 
                                    type="number" 
                                    placeholder="Min" 
                                    style={{ ...styles.formInput, width: 70, padding: '6px 8px', fontSize: 12 }}
                                    value={filters.minTables}
                                    onChange={e => setFilters(f => ({ ...f, minTables: e.target.value }))}
                                />
                                <span style={{ color: '#71717a' }}>-</span>
                                <input 
                                    type="number" 
                                    placeholder="Max" 
                                    style={{ ...styles.formInput, width: 70, padding: '6px 8px', fontSize: 12 }}
                                    value={filters.maxTables}
                                    onChange={e => setFilters(f => ({ ...f, maxTables: e.target.value }))}
                                />
                            </div>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                <span style={{ fontSize: 12, color: '#71717a' }}>Next contact before:</span>
                                <input 
                                    type="date" 
                                    style={{ ...styles.formInput, padding: '6px 8px', fontSize: 12 }}
                                    value={filters.nextContactBefore}
                                    onChange={e => setFilters(f => ({ ...f, nextContactBefore: e.target.value }))}
                                />
                            </div>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                <span style={{ fontSize: 12, color: '#71717a' }}>Trial after:</span>
                                <input 
                                    type="date" 
                                    style={{ ...styles.formInput, padding: '6px 8px', fontSize: 12 }}
                                    value={filters.trialDateAfter}

                                />

                                />
                                <span style={{ fontSize: 12, color: '#ef4444' }}>Overdue only</span>
                            </label>
                            <button 
                                style={{ ...styles.btn, ...styles.btnSecondary, padding: '6px 12px', fontSize: 12 }}
                                onClick={() => setFilters({ minTables: '', maxTables: '', nextContactBefore: '', trialDateAfter: '', showOverdueOnly: false })}
                            >
                                Clear
                            </button>
                        </div>
                    </div>

                    {/* 6-Month Forecast Chart */}
                    <div style={{ ...styles.card, marginBottom: 24 }}>
                        <div style={styles.cardHeader}>
                            <span style={styles.cardTitle}>📊 6-Month Revenue Forecast</span>
                            <div style={{ display: 'flex', gap: 16, fontSize: 11 }}>
                                <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                                    <span style={{ width: 12, height: 12, background: '#22c55e', borderRadius: 2 }}></span>
                                    Commit (85%)
                                </span>
                                <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                                    <span style={{ width: 12, height: 12, background: '#f59e0b', borderRadius: 2 }}></span>
                                    Best Case (50%)
                                </span>
                                <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                                    <span style={{ width: 12, height: 12, background: '#3b82f6', borderRadius: 2 }}></span>
                                    Pipeline (25-40%)
                                </span>
                            </div>
                        </div>
                        <div style={{ padding: 20 }}>
                            {/* Stacked Bar Chart with Confidence Bands */}
                            <div style={{ position: 'relative', height: 200, marginBottom: 16 }}>
                                {/* Y-axis labels */}
                                <div style={{ position: 'absolute', left: 0, top: 0, bottom: 30, width: 60, display: 'flex', flexDirection: 'column', justifyContent: 'space-between', fontSize: 10, color: '#71717a' }}>
                                    {(() => {
                                        const maxValue = Math.max(...forecast.map(f => f.total), 1);
                                        return [maxValue, maxValue * 0.75, maxValue * 0.5, maxValue * 0.25, 0].map((v, i) => (
                                            <span key={i}>{formatCurrency(Math.round(v))}</span>
                                        ));
                                    })()}
                                </div>
                                
                                {/* Chart area */}
                                <div style={{ marginLeft: 65, height: '100%', display: 'flex', alignItems: 'flex-end', gap: 8 }}>
                                    {forecast.map((m, i) => {
                                        const maxValue = Math.max(...forecast.map(f => f.total), 1);
                                        const chartHeight = 160;
                                        const commitHeight = (m.commit / maxValue) * chartHeight;
                                        const bestCaseHeight = (m.bestCase / maxValue) * chartHeight;
                                        const pipelineHeight = (m.pipeline / maxValue) * chartHeight;
                                        const upsideHeight = (m.upside / maxValue) * chartHeight;
                                        
                                        return (
                                            <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                                                {/* Value label */}
                                                <div style={{ fontSize: 10, color: '#a1a1aa', marginBottom: 4, height: 16 }}>
                                                    {m.weighted > 0 ? formatCurrency(m.weighted) : ''}
                                                </div>
                                                
                                                {/* Stacked bar */}
                                                <div style={{ width: '100%', height: chartHeight, display: 'flex', flexDirection: 'column-reverse', borderRadius: 4, overflow: 'hidden' }}>
                                                    {/* Commit - bottom (green) */}
                                                    <div style={{ 
                                                        width: '100%', 
                                                        height: commitHeight || 0, 
                                                        background: '#22c55e',
                                                        minHeight: m.commit > 0 ? 2 : 0
                                                    }} title={`Commit: ${formatCurrency(m.commit)}`} />
                                                    
                                                    {/* Best Case (orange) */}
                                                    <div style={{ 
                                                        width: '100%',

                                    {(() => {

                                        const maxCumulative = Math.max(...forecast.map(f => f.cumulativePipeline), 1);
                                        const width = 100 / forecast.length;
                                        
                                        // Create path for cumulative line
                                        const points = forecast.map((m, i) => {
                                            const x = (i * width) + (width / 2);
                                            const y = 160 - ((m.cumulativePipeline / maxCumulative) * 150);
                                            return `${x}%,${y}`;

                                                    fill="none"
                                                    stroke="#a855f7"
                                                    strokeWidth="2"
                                                    strokeDasharray="4,4"

                                                {forecast.map((m, i) => {

                                                    const y = 160 - ((m.cumulativePipeline / maxCumulative) * 150);
                                                    return (

        // Restaurant List Component
        const RestaurantList = ({ restaurants, contacts, search, filter, onEdit, onDelete }) => {
            const filtered = useMemo(() => {
                let result = [...restaurants];
                if (search) {
                    const s = search.toLowerCase();
                    result = result.filter(r => 
                        r.name.toLowerCase().includes(s) || 
                        r.contact?.toLowerCase().includes(s) ||
                        r.group?.toLowerCase().includes(s)
                    );
                }
                if (filter) {
                    result = result.filter(r => r.stage === filter);
                }
                return result.sort((a, b) => {
                    // Sort by next contact date - soonest first, no date at end
                    const aDate = a.nextContact ? new Date(a.nextContact) : new Date('9999-12-31');
                    const bDate = b.nextContact ? new Date(b.nextContact) : new Date('9999-12-31');
                    return aDate - bDate;
                });
            }, [restaurants, search, filter]);
            
            const getContactNames = (contactIds) => {
                if (!contactIds || contactIds.length === 0) return null;
                return contactIds.map(id => contacts.find(c => c.id === id)).filter(Boolean);
            };

            return (
                <div style={styles.card}>
                    <table style={styles.table}>
                        <thead>
                            <tr>
                                <th style={styles.th}>Restaurant</th>
                                <th style={styles.th}>Stage</th>
                                <th style={styles.th}>Contacts</th>
                                <th style={styles.th}>Next Contact</th>

                                        <div style={{ fontWeight: 600 }}>{r.name}</div>

                                    <td style={styles.td}>
                                        {linkedContacts && linkedContacts.length > 0 ? (
                                            <div>
                                                <div style={{ fontWeight: 500 }}>{linkedContacts[0].name}</div>
                                                <div style={{ fontSize: 12, color: '#71717a' }}>
                                                    {linkedContacts[0].role}
                                                    {linkedContacts.length > 1 && ` +${linkedContacts.length - 1} more`}
                                                </div>
                                            </div>

                                                <div>
                                                    <div style={{ fontWeight: 500 }}>{r.contact}</div>

                                        {r.nextContact ? (
                                            (() => {

                                                today.setHours(0, 0, 0, 0);

                                                const isOverdue = nextDate < today;
                                                const isToday = nextDate.getTime() === today.getTime();
                                                return (
                                                    <>
                                                        <div style={{ color: isOverdue ? '#ef4444' : isToday ? '#eab308' : 'inherit' }}>{r.nextContact}</div>
                                                        <div style={{ fontSize: 12, color: '#71717a', textTransform: 'capitalize' }}>{r.nextContactType}</div>
                                                    </>

        // Main App
        const App = () => {
            const [page, setPage] = useState('dashboard');
            const [restaurants, setRestaurants] = useState([]);
            const [contacts, setContacts] = useState([]);
            const [search, setSearch] = useState('');
            const [filter, setFilter] = useState('');
            const [modal, setModal] = useState(null);
            const [contactModal, setContactModal] = useState(null);
            const [loading, setLoading] = useState(true);
            const [syncing, setSyncing] = useState(false);
            const [lastSync, setLastSync] = useState(null);
            const [error, setError] = useState(null);

            // Load data from Google Sheets on mount
            useEffect(() => {
                const loadInitialData = async () => {
                    setLoading(true);
                    setError(null);
                    try {
                        const data = await sheetsAPI.loadAll();
                        setRestaurants(data.restaurants || []);
                        setContacts(data.contacts || []);
                        setLastSync(new Date());
                    } catch (err) {
                        console.error('Load error:', err);
                        setError(err.message);
                    }
                    setLoading(false);
                };
                loadInitialData();
            }, []);

            // Refresh data from Google Sheets
            const handleRefresh = useCallback(async () => {
                setSyncing(true);
                setError(null);
                try {
                    const data = await sheetsAPI.loadAll();
                    setRestaurants(data.restaurants || []);
                    setContacts(data.contacts || []);
                    setLastSync(new Date());
                } catch (err) {
                    console.error('Refresh error:', err);
                    setError(err.message);
                }
                setSyncing(false);
            }, []);

            // Save restaurant and sync contact associations
            const handleSave = async (restaurant) => {
                const restaurantId = restaurant.id || Date.now().toString();
                const savedRestaurant = { ...restaurant, id: restaurantId };
                
                // Update local state
                setRestaurants(prev => {
                    const exists = prev.find(r => r.id === savedRestaurant.id);
                    if (exists) return prev.map(r => r.id === savedRestaurant.id ? savedRestaurant : r);
                    return [...prev, savedRestaurant];
                });
                
                // Sync contacts: update restaurantIds for all contacts
                const updatedContacts = contacts.map(contact => {
                    const isLinked = (savedRestaurant.contactIds || []).includes(contact.id);
                    const hasRestaurant = (contact.restaurantIds || []).includes(restaurantId);
                    
                    if (isLinked && !hasRestaurant) {
                        return { ...contact, restaurantIds: [...(contact.restaurantIds || []), restaurantId] };
                    } else if (!isLinked && hasRestaurant) {
                        return { ...contact, restaurantIds: (contact.restaurantIds || []).filter(id => id !== restaurantId) };
                    }
                    return contact;
                });
                setContacts(updatedContacts);
                
                // Save to Google Sheets
                try {
                    await sheetsAPI.saveRestaurant(savedRestaurant);
                    // Save any updated contacts
                    for (const contact of updatedContacts) {
                        const original = contacts.find(c => c.id === contact.id);
                        if (JSON.stringify(original?.restaurantIds) !== JSON.stringify(contact.restaurantIds)) {
                            await sheetsAPI.saveContact(contact);
                        }
                    }
                } catch (err) {
                    console.error('Save error:', err);
                    setError('Failed to save: ' + err.message);
                }
                
                setModal(null);
            };

            // Save contact and sync restaurant associations
            const handleSaveContact = async (contact, skipModalClose = false) => {
                const contactId = contact.id || Date.now().toString();
                const savedContact = { ...contact, id: contactId };
                
                // Update local state
                setContacts(prev => {
                    const exists = prev.find(c => c.id === savedContact.id);
                    if (exists) return prev.map(c => c.id === savedContact.id ? savedContact : c);
                    return [...prev, savedContact];
                });
                
                // Sync restaurants: update contactIds for all restaurants
                const updatedRestaurants = restaurants.map(restaurant => {
                    const isLinked = (savedContact.restaurantIds || []).includes(restaurant.id);
                    const hasContact = (restaurant.contactIds || []).includes(contactId);
                    
                    if (isLinked && !hasContact) {
                        return { ...restaurant, contactIds: [...(restaurant.contactIds || []), contactId] };
                    } else if (!isLinked && hasContact) {
                        return { ...restaurant, contactIds: (restaurant.contactIds || []).filter(id => id !== contactId) };
                    }
                    return restaurant;
                });
                setRestaurants(updatedRestaurants);
                
                // Save to Google Sheets
                try {
                    await sheetsAPI.saveContact(savedContact);
                    // Save any updated restaurants
                    for (const restaurant of updatedRestaurants) {
                        const original = restaurants.find(r => r.id === restaurant.id);
                        if (JSON.stringify(original?.contactIds) !== JSON.stringify(restaurant.contactIds)) {
                            await sheetsAPI.saveRestaurant(restaurant);
                        }
                    }
                } catch (err) {
                    console.error('Save error:', err);
                    setError('Failed to save: ' + err.message);
                }
                
                if (!skipModalClose) setContactModal(null);
            };

            const handleDelete = async (id) => {
                if (confirm('Delete this restaurant?')) {
                    setRestaurants(prev => prev.filter(r => r.id !== id));
                    // Also remove from contacts' restaurantIds
                    const updatedContacts = contacts.map(c => ({
                        ...c,
                        restaurantIds: (c.restaurantIds || []).filter(rid => rid !== id)
                    }));
                    setContacts(updatedContacts);
                    
                    // Delete from Google Sheets
                    try {
                        await sheetsAPI.deleteRestaurant(id);
                        // Update contacts that had this restaurant
                        for (const contact of updatedContacts) {
                            const original = contacts.find(c => c.id === contact.id);
                            if (original?.restaurantIds?.includes(id)) {
                                await sheetsAPI.saveContact(contact);
                            }
                        }
                    } catch (err) {
                        console.error('Delete error:', err);
                        setError('Failed to delete: ' + err.message);
                    }
                }
            };

            const handleDeleteContact = async (id) => {
                if (confirm('Delete this contact?')) {
                    setContacts(prev => prev.filter(c => c.id !== id));
                    // Also remove from restaurants' contactIds
                    const updatedRestaurants = restaurants.map(r => ({
                        ...r,
                        contactIds: (r.contactIds || []).filter(cid => cid !== id)
                    }));
                    setRestaurants(updatedRestaurants);
                    
                    // Delete from Google Sheets
                    try {
                        await sheetsAPI.deleteContact(id);
                        // Update restaurants that had this contact
                        for (const restaurant of updatedRestaurants) {
                            const original = restaurants.find(r => r.id === restaurant.id);
                            if (original?.contactIds?.includes(id)) {
                                await sheetsAPI.saveRestaurant(restaurant);
                            }
                        }
                    } catch (err) {
                        console.error('Delete error:', err);
                        setError('Failed to delete: ' + err.message);
                    }
                }
            };

            // Handle stage change from Kanban drag-drop
            const handleStageChange = async (restaurantId, newStage) => {
                let updatedRestaurant = null;
                setRestaurants(prev => prev.map(r => {
                    if (r.id === restaurantId) {
                        updatedRestaurant = {
                            ...r,
                            stage: newStage,
                            stageEnteredDate: new Date().toISOString().split('T')[0]
                        };
                        return updatedRestaurant;
                    }
                    return r;
                }));
                
                // Save to Google Sheets
                if (updatedRestaurant) {
                    try {
                        await sheetsAPI.saveRestaurant(updatedRestaurant);
                    } catch (err) {
                        console.error('Stage change error:', err);
                        setError('Failed to update stage: ' + err.message);
                    }
                }
            };

            // Quick add note to a restaurant
            const handleAddNote = async (restaurantId, noteText) => {
                const newNote = {
                    id: Date.now().toString(),
                    date: new Date().toISOString().split('T')[0],
                    text: noteText
                };
                
                let updatedRestaurant = null;
                setRestaurants(prev => prev.map(r => {
                    if (r.id === restaurantId) {
                        updatedRestaurant = {
                            ...r,
                            notesHistory: [...(r.notesHistory || []), newNote]
                        };
                        return updatedRestaurant;
                    }
                    return r;
                }));
                
                // Save to Google Sheets
                if (updatedRestaurant) {
                    try {
                        await sheetsAPI.saveRestaurant(updatedRestaurant);
                    } catch (err) {
                        console.error('Save note error:', err);
                        setError('Failed to save note: ' + err.message);
                    }
                }
            };

            const exportData = () => {
                const data = { restaurants, contacts };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'remy-data.json'; a.click();
            };

            const importData = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!confirm('Import data from JSON file?\n\nThis will REPLACE all data in Google Sheets.')) {
                    return;
                }
                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        setSyncing(true);
                        if (Array.isArray(data)) {
                            // Legacy format - just restaurants
                            setRestaurants(data);
                            await sheetsAPI.syncAll(data, contacts);
                            alert('Restaurants imported and synced to Google Sheets!');
                        } else if (data.restaurants) {
                            // New format with both restaurants and contacts
                            setRestaurants(data.restaurants);
                            if (data.contacts) setContacts(data.contacts);
                            await sheetsAPI.syncAll(data.restaurants, data.contacts || contacts);
                            alert('Data imported and synced to Google Sheets!');
                        }
                        setSyncing(false);
                        setLastSync(new Date());
                    } catch (err) {
                        setSyncing(false);
                        alert('Import failed: ' + err.message);
                    }
                };
                reader.readAsText(file);
            };

            // Show loading screen
            if (loading) {
                return (
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', background: '#09090b' }}>
                        <div style={{ textAlign: 'center' }}>
                            <div style={{ fontSize: 48, marginBottom: 16 }}>🐀</div>
                            <div style={{ color: '#f97316', fontSize: 18, fontWeight: 600 }}>Loading...</div>
                            <div style={{ color: '#71717a', fontSize: 13, marginTop: 8 }}>
                                Connecting to Google Sheets
                            </div>
                        </div>
                    </div>
                );
            }

            // Show error screen if failed to load
            if (error && restaurants.length === 0) {
                return (
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', background: '#09090b' }}>
                        <div style={{ textAlign: 'center', maxWidth: 400, padding: 20 }}>
                            <div style={{ fontSize: 48, marginBottom: 16 }}>⚠️</div>
                            <div style={{ color: '#ef4444', fontSize: 18, fontWeight: 600, marginBottom: 12 }}>Connection Error</div>
                            <div style={{ color: '#a1a1aa', fontSize: 14, marginBottom: 20 }}>{error}</div>
                            <div style={{ color: '#71717a', fontSize: 12, marginBottom: 20 }}>
                                Make sure you've:<br/>
                                1. Pasted your Google Script URL on line 26<br/>
                                2. Deployed the script as a Web App<br/>
                                3. Set access to "Anyone"
                            </div>
                            <button 
                                onClick={() => window.location.reload()} 
                                style={{ background: '#f97316', color: '#fff', border: 'none', padding: '10px 20px', borderRadius: 6, cursor: 'pointer', fontSize: 14 }}
                            >
                                Retry
                            </button>
                        </div>
                    </div>
                );
            }

            return (

                                </div>
                            <div style={{ fontSize: 10, color: '#22c55e', marginTop: 4, display: 'flex', alignItems: 'center', gap: 4 }}>
                                <span style={{ width: 6, height: 6, background: syncing ? '#f59e0b' : '#22c55e', borderRadius: '50%' }}></span>
                                {syncing ? 'Syncing...' : 'Google Sheets'}
                            </div>
                            {error && (
                                <div style={{ fontSize: 10, color: '#ef4444', marginTop: 4 }}>
                                    ⚠️ {error}
                                </div>
                            )}
                        </div>
                        <nav style={styles.nav}>
                            <div style={{ ...styles.navItem, ...(page === 'dashboard' ? styles.navItemActive : {}) }} onClick={() => setPage('dashboard')}>
                                <Icon name="home" /> Dashboard
                            </div>
                            <div style={{ ...styles.navItem, ...(page === 'pipeline' ? styles.navItemActive : {}) }} onClick={() => setPage('pipeline')}>
                                <Icon name="target" /> Pipeline
                            </div>
                            <div style={{ ...styles.navItem, ...(page === 'list' ? styles.navItemActive : {}) }} onClick={() => setPage('list')}>
                                <Icon name="list" /> All Restaurants
                                <span style={{ marginLeft: 'auto', background: '#27272a', padding: '2px 8px', borderRadius: 10, fontSize: 11 }}>{restaurants.length}</span>
                            </div>
                            <div style={{ ...styles.navItem, ...(page === 'contacts' ? styles.navItemActive : {}) }} onClick={() => setPage('contacts')}>
                                <Icon name="users" /> Contacts
                                <span style={{ marginLeft: 'auto', background: '#27272a', padding: '2px 8px', borderRadius: 10, fontSize: 11 }}>{contacts.length}</span>
                            </div>
                            
                            <div style={{ marginTop: 24, padding: '8px 12px', fontSize: 11, color: '#52525b', textTransform: 'uppercase', letterSpacing: 0.5 }}>Sync</div>
                            <div 
                                style={{ ...styles.navItem, opacity: syncing ? 0.5 : 1 }} 
                                onClick={syncing ? null : handleRefresh}
                            >
                                <Icon name="refresh" /> {syncing ? 'Syncing...' : 'Refresh from Sheets'}
                            </div>
                            {lastSync && (
                                <div style={{ padding: '4px 12px', fontSize: 10, color: '#52525b' }}>
                                    Last sync: {lastSync.toLocaleTimeString()}
                                </div>
                            )}
                            
                            <div style={{ marginTop: 24, padding: '8px 12px', fontSize: 11, color: '#52525b', textTransform: 'uppercase', letterSpacing: 0.5 }}>Data</div>
                            <div style={styles.navItem} onClick={exportData}>
                                <Icon name="download" /> Export JSON
                            </div>
                            <label style={{ ...styles.navItem, cursor: 'pointer' }}>
                                <Icon name="upload" /> Import JSON
                                <input type="file" accept=".json" onChange={importData} style={{ display: 'none' }} />
                            </label>
                        </nav>
                    </aside>

                    <main style={styles.main}>
                        <header style={styles.header}>
                            <h1 style={styles.pageTitle}>
                                {page === 'dashboard' ? 'Dashboard' : page === 'pipeline' ? 'Pipeline' : page === 'list' ? 'All Restaurants' : 'Contacts'}
                            </h1>
                            <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
                                {page === 'list' && (
                                    <>
                                        <div style={styles.searchBox}>
                                            <Icon name="search" size={16} />
                                            <input style={styles.searchInput} placeholder="Search..." value={search} onChange={e => setSearch(e.target.value)} />
                                        </div>
                                        <select style={{ ...styles.formInput, width: 160 }} value={filter} onChange={e => setFilter(e.target.value)}>
                                            <option value="">All Stages</option>
                                            {STAGES.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                        </select>
                                        <button style={{ ...styles.btn, ...styles.btnPrimary }} onClick={() => setModal({})}>
                                            <Icon name="plus" size={16} /> Add Restaurant
                                        </button>
                                    </>
                                )}
                                {page === 'contacts' && (
                                    <>
                                        <div style={styles.searchBox}>
                                            <Icon name="search" size={16} />
                                            <input style={styles.searchInput} placeholder="Search contacts..." value={search} onChange={e => setSearch(e.target.value)} />
                                        </div>
                                        <button style={{ ...styles.btn, ...styles.btnPrimary }} onClick={() => setContactModal({})}>
                                            <Icon name="plus" size={16} /> Add Contact
                                        </button>
                                    </>
                                )}
                                {page === 'dashboard' && (
                                    <button style={{ ...styles.btn, ...styles.btnPrimary }} onClick={() => setModal({})}>
                                        <Icon name="plus" size={16} /> Add Restaurant
                                    </button>
                                )}
                            </div>
                        </header>

                        <div style={styles.content}>
                            {page === 'dashboard' ? (
                                <Dashboard restaurants={restaurants} onEdit={setModal} onAddNote={handleAddNote} />
                            ) : page === 'pipeline' ? (
                                <PipelineView restaurants={restaurants} onEdit={setModal} onStageChange={handleStageChange} />
                            ) : page === 'list' ? (
                                <RestaurantList restaurants={restaurants} contacts={contacts} search={search} filter={filter} onEdit={setModal} onDelete={handleDelete} />
                            ) : (
                                <ContactList contacts={contacts} restaurants={restaurants} search={search} onEdit={setContactModal} onDelete={handleDeleteContact} />
                            )}
                        </div>
                    </main>

                    {modal !== null && (
                        <RestaurantModal 
                            restaurant={modal.id ? modal : null} 
                            contacts={contacts}
                            onSave={handleSave} 
                            onSaveContact={(c) => handleSaveContact(c, true)}
                            onClose={() => setModal(null)} 
                        />
                    )}

                    {contactModal !== null && (
                        <ContactModal contact={contactModal.id ? contactModal : null} restaurants={restaurants} onSave={handleSaveContact} onClose={() => setContactModal(null)} />
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
