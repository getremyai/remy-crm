// localStorage fallback keys
const LS_KEY='remy_crm_v2';
const LS_VER_KEY='remy_crm_v2_ver';
const DATA_VERSION='v3.0_supabase';

const loadLocalData=()=>{try{return JSON.parse(localStorage.getItem(LS_KEY))||null}catch{return null}};
const saveLocalData=(data)=>{try{localStorage.setItem(LS_KEY,JSON.stringify(data));localStorage.setItem(LS_VER_KEY,DATA_VERSION)}catch{}};

const initLocalData=()=>{
  const storedVer=localStorage.getItem(LS_VER_KEY);
  if(storedVer!==DATA_VERSION){localStorage.removeItem(LS_KEY);localStorage.removeItem('remy_crm_user');localStorage.setItem(LS_VER_KEY,DATA_VERSION);}
  const existing=loadLocalData();
  if(existing&&existing.users&&existing.users.length>0)return existing;
  const fresh={users:SEED_USERS,restaurants:SEED_RESTAURANTS,contacts:SEED_CONTACTS,contact_restaurants:SEED_CONTACT_RESTAURANTS,activities:SEED_ACTIVITIES,funding_deals:SEED_FUNDING_DEALS,partnerships:SEED_PARTNERSHIPS};
  saveLocalData(fresh);
  return fresh;
};

const EMPTY_DATA={users:[],restaurants:[],contacts:[],contact_restaurants:[],activities:[],funding_deals:[],partnerships:[]};

const AppContext=createContext();

const AppProvider=({children})=>{
  const[data,setDataRaw]=useState(EMPTY_DATA);
  const[currentUser,setCurrentUserRaw]=useState(null);
  const[page,setPage]=useState('dashboard');
  const[toast,setToast]=useState(null);
  const[loading,setLoading]=useState(true);
  const[authReady,setAuthReady]=useState(false);
  const[isOnline,setIsOnline]=useState(true); // Supabase connected

  // ---------- AUTH ----------
  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{
      if(session?.user)handleAuthUser(session.user);
      else setLoading(false);
      setAuthReady(true);
    });
    const{data:{subscription}}=sb.auth.onAuthStateChange((event,session)=>{
      if(event==='SIGNED_IN'&&session?.user)handleAuthUser(session.user);
      else if(event==='SIGNED_OUT'){setCurrentUserRaw(null);setLoading(false)}
    });
    return()=>subscription.unsubscribe();
  },[]);

  const handleAuthUser=async(authUser)=>{
    // Upsert into our users table
    const{data:existing}=await sb.from('users').select('*').eq('email',authUser.email).maybeSingle();
    let user;
    if(existing){
      user=existing;
    }else{
      const{data:newUser,error}=await sb.from('users').insert({
        email:authUser.email,
        full_name:authUser.user_metadata?.full_name||authUser.user_metadata?.name||authUser.email.split('@')[0],
        role:'sales_rep'
      }).select().single();
      if(error){console.error('User insert error:',error);setLoading(false);return;}
      user=newUser;
    }
    setCurrentUserRaw(user);
    await fetchAllData();
    setLoading(false);
  };

  // ---------- FETCH ALL DATA ----------
  const fetchAllData=async()=>{
    try{
      const[u,r,c,cr,a,fd,pa]=await Promise.all([
        sb.from('users').select('*'),
        sb.from('restaurants').select('*'),
        sb.from('contacts').select('*'),
        sb.from('contact_restaurants').select('*'),
        sb.from('activities').select('*').order('occurred_at',{ascending:false}),
        sb.from('funding_deals').select('*').then(res=>res).catch(()=>({data:[]})),
        sb.from('partnerships').select('*').then(res=>res).catch(()=>({data:[]}))
      ]);
      const fresh={
        users:u.data||[],
        restaurants:r.data||[],
        contacts:c.data||[],
        contact_restaurants:cr.data||[],
        activities:a.data||[],
        funding_deals:fd.data||[],
        partnerships:pa.data||[]
      };
      setDataRaw(fresh);
      saveLocalData(fresh); // cache locally
      setIsOnline(true);
    }catch(err){
      console.error('Fetch error, falling back to local:',err);
      setDataRaw(initLocalData());
      setIsOnline(false);
    }
  };

  // ---------- REALTIME SUBSCRIPTIONS ----------
  useEffect(()=>{
    if(!authReady||!currentUser)return;
    const channel=sb.channel('crm-changes')
      .on('postgres_changes',{event:'*',schema:'public',table:'restaurants'},()=>refreshTable('restaurants'))
      .on('postgres_changes',{event:'*',schema:'public',table:'contacts'},()=>refreshTable('contacts'))
      .on('postgres_changes',{event:'*',schema:'public',table:'activities'},()=>refreshTable('activities'))
      .on('postgres_changes',{event:'*',schema:'public',table:'contact_restaurants'},()=>refreshTable('contact_restaurants'))
      .on('postgres_changes',{event:'*',schema:'public',table:'users'},()=>refreshTable('users'))
      .on('postgres_changes',{event:'*',schema:'public',table:'funding_deals'},()=>refreshTable('funding_deals'))
      .on('postgres_changes',{event:'*',schema:'public',table:'partnerships'},()=>refreshTable('partnerships'))
      .subscribe();
    return()=>sb.removeChannel(channel);
  },[authReady,currentUser]);

  const refreshTable=async(table)=>{
    const order=table==='activities'?{column:'occurred_at',ascending:false}:undefined;
    const q=sb.from(table).select('*');
    if(order)q.order(order.column,{ascending:order.ascending});
    const{data:rows}=await q;
    if(rows)setDataRaw(prev=>{const next={...prev,[table]:rows};saveLocalData(next);return next});
  };

  // ---------- HELPERS ----------
  const setCurrentUser=(u)=>setCurrentUserRaw(u);

  useEffect(()=>{
    if(currentUser&&data.users.length>0){
      const fresh=data.users.find(u=>u.id===currentUser.id);
      if(fresh&&(fresh.role!==currentUser.role||fresh.full_name!==currentUser.full_name)){
        setCurrentUserRaw(fresh);
      }
    }
  },[data.users]);

  const setData=useCallback((updater)=>{
    setDataRaw(prev=>{
      const next=typeof updater==='function'?updater(prev):{...prev,...updater};
      saveLocalData(next);
      return next;
    });
  },[]);

  const showToast=useCallback((msg,type='success')=>{
    setToast({msg,type});
    setTimeout(()=>setToast(null),3000);
  },[]);

  // ---------- AUTH ACTIONS ----------

    const oldR=data.restaurants.find(r=>r.id===id);

    // Optimistic update
    setData(d=>({...d,restaurants:d.restaurants.map(r=>r.id===id?newR:r)}));

    const{error}=await sb.from('restaurants').update(updates).eq('id',id);
    if(error){showToast('Save failed: '+error.message,'error');return}

    if(updates.stage&&updates.stage!==oldR.stage){
      const act={restaurant_id:id,contact_id:null,user_id:currentUser?.id,type:'stage_change',subject:`Moved to ${STAGE_MAP[updates.stage]?.name||updates.stage}`,body:updates.close_reason?`Reason: ${updates.close_reason}`:'',occurred_at:new Date().toISOString(),metadata:{old_stage:oldR.stage,new_stage:updates.stage,close_reason:updates.close_reason||''}};
      await sb.from('activities').insert(act);
      await sb.from('restaurants').update({stage_entered_at:new Date().toISOString().slice(0,10)}).eq('id',id);
    }

  const addRestaurant=useCallback(async(r)=>{

  // ---------- CRUD: CONTACTS ----------
  const addContact=useCallback(async(c)=>{

    await sb.from('contacts').update(updates).eq('id',id);

    await sb.from('contacts').delete().eq('id',id);
    showToast('Contact deleted');
  },[setData,showToast]);

  // ---------- CRUD: LINKS ----------
  const linkContact=useCallback(async(contactId,restaurantId,roleTags,isPrimary,notes)=>{
    const existing=data.contact_restaurants.find(cr=>cr.contact_id===contactId&&cr.restaurant_id===restaurantId);
    if(existing){
      setData(d=>({...d,contact_restaurants:d.contact_restaurants.map(cr=>cr.id===existing.id?{...cr,role_tags:roleTags,is_primary:isPrimary,relationship_notes:notes}:cr)}));

    }else{
      const newCR={contact_id:contactId,restaurant_id:restaurantId,role_tags:roleTags,is_primary:isPrimary,relationship_notes:notes||''};
      const{data:inserted}=await sb.from('contact_restaurants').insert(newCR).select().single();
      if(inserted)setData(d=>({...d,contact_restaurants:[...d.contact_restaurants,inserted]}));

    await sb.from('contact_restaurants').delete().neq('id','00000000-0000-0000-0000-000000000000');

    await sb.from('restaurants').delete().neq('id','00000000-0000-0000-0000-000000000000');
    await fetchAllData();
    showToast('Data reset');
  },[showToast]);

  // ---------- LEGACY COMPAT: login function for email fallback ----------
  const login=useCallback((email,name)=>{
    // This is now just for the magic link flow prompt
    loginWithEmail(email);
  },[loginWithEmail]);

  const value=useMemo(()=>({data,currentUser,page,setPage,toast,showToast,login,loginWithGoogle,loginWithEmail,logout,updateRestaurant,addRestaurant,deleteRestaurant,addContact,updateContact,deleteContact,linkContact,unlinkContact,addActivity,updateUser,removeUser,getUserName,resetData,setData,loading,isOnline,addFundingDeal,updateFundingDeal,deleteFundingDeal,addPartnership,updatePartnership,deletePartnership}),[data,currentUser,page,setPage,toast,showToast,login,loginWithGoogle,loginWithEmail,logout,updateRestaurant,addRestaurant,deleteRestaurant,addContact,updateContact,deleteContact,linkContact,unlinkContact,addActivity,updateUser,removeUser,getUserName,resetData,setData,loading,isOnline,addFundingDeal,updateFundingDeal,deleteFundingDeal,addPartnership,updatePartnership,deletePartnership]);

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
};

const PaceIndicator=({value,target,daysElapsed,totalDays})=>{
  if(!target||!totalDays)return null;
  const expectedPace=(daysElapsed/totalDays)*target;
  const ratio=expectedPace>0?value/expectedPace:value>0?2:0;
  const label=ratio>=1.1?'Ahead':ratio>=0.85?'On track':'Behind';
  const color=ratio>=1.1?'#10b981':ratio>=0.85?'#f59e0b':'#ef4444';
  return <span style={{fontSize:11,fontWeight:600,color,padding:'2px 8px',borderRadius:4,background:`${color}22`}}>{label}</span>;
};

const Dashboard=()=>{
  const{data,currentUser,updateRestaurant,addActivity,setPage,showToast}=useApp();
  const{restaurants,activities,users,funding_deals,partnerships}=data;
  const[selectedRest,setSelectedRest]=useState('');
  const[quickNote,setQuickNote]=useState('');
  const[quickType,setQuickType]=useState('note');
  const[showQuickStage,setShowQuickStage]=useState(false);

  const stats=useMemo(()=>{
    const live=restaurants.filter(r=>r.stage==='live');
    const mrr=live.reduce((s,r)=>s+(parseFloat(r.target_mrr)||0),0);
    return{
      total:restaurants.length,
      live:live.length,
      pipeline:restaurants.filter(r=>!['live','closed','identified'].includes(r.stage)).length,
      trials:restaurants.filter(r=>r.stage==='trial').length,
      mrr,
      closed:restaurants.filter(r=>r.stage==='closed').length
    };
  },[restaurants]);

  const fundingStats=useMemo(()=>{
    const deals=funding_deals||[];
    const active=deals.filter(d=>d.stage!=='closed');
    const closed=deals.filter(d=>d.stage==='closed');
    const hot=deals.filter(d=>['dd','term_sheet'].includes(d.stage));
    const totalTarget=active.reduce((s,d)=>s+(parseFloat(d.amount_target)||0),0);
    const totalClosed=closed.reduce((s,d)=>s+(parseFloat(d.amount_target)||0),0);
    return{total:deals.length,active:active.length,hot:hot.length,closed:closed.length,totalTarget,totalClosed};
  },[funding_deals]);

  const partnerStats=useMemo(()=>{
    const ps=partnerships||[];
    const live=ps.filter(p=>p.stage==='live');
    const pipe=ps.filter(p=>!['live','churned'].includes(p.stage));
    const churned=ps.filter(p=>p.stage==='churned');
    return{total:ps.length,live:live.length,pipeline:pipe.length,churned:churned.length};
  },[partnerships]);

  const nextActions=useMemo(()=>{
    const t=new Date();t.setHours(0,0,0,0);
    return restaurants
      .filter(r=>r.stage!=='live'&&r.stage!=='closed'&&r.next_action_date)
      .map(r=>{const d=new Date(r.next_action_date);const diff=Math.ceil((d-t)/86400000);return{...r,daysUntil:diff,isOverdue:diff<0}})
      .sort((a,b)=>a.daysUntil-b.daysUntil)
      .slice(0,8);
  },[restaurants]);

  const myStats=useMemo(()=>{
    if(!currentUser)return{deals:0,mrr:0,conversations:0,proposals:0,trials:0};
    const som=startOfMonth();const sow=startOfWeek();
    const myActs=activities.filter(a=>a.user_id===currentUser.id);
    return{
      deals:restaurants.filter(r=>r.stage==='live'&&r.owner_id===currentUser.id&&new Date(r.stage_entered_at)>=som).length,
      mrr:restaurants.filter(r=>r.stage==='live'&&r.owner_id===currentUser.id&&new Date(r.stage_entered_at)>=som).reduce((s,r)=>s+(parseFloat(r.target_mrr)||0),0),
      conversations:myActs.filter(a=>['call','meeting'].includes(a.type)&&new Date(a.occurred_at)>=sow).length,
      proposals:restaurants.filter(r=>r.owner_id===currentUser.id&&r.stage==='proposal'&&new Date(r.stage_entered_at)>=sow).length,
      trials:restaurants.filter(r=>r.owner_id===currentUser.id&&r.stage==='trial'&&new Date(r.stage_entered_at)>=som).length
    };
  },[restaurants,activities,currentUser]);

  const handleQuickLog=()=>{
    if(!selectedRest||!quickNote.trim())return;
    const labels={note:'Quick note',call:'Call logged',email:'Email sent',meeting:'Meeting note'};
    addActivity({restaurant_id:selectedRest,contact_id:'',type:quickType,subject:labels[quickType]||quickType,body:quickNote.trim(),occurred_at:new Date().toISOString(),metadata:{}});
    setQuickNote('');
    showToast(`${labels[quickType]} added`);
  };

  const handleQuickStage=(restId,newStage)=>{
    updateRestaurant(restId,{stage:newStage});
    showToast('Stage updated');
  };

  const funnelData=useMemo(()=>{
    const groups=[
      {name:'Identified',stages:['identified'],color:'#6b7280'},
      {name:'Outreach',stages:['outreach'],color:'#8b5cf6'},
      {name:'Engaged',stages:['engaged'],color:'#3b82f6'},
      {name:'Proposal',stages:['proposal'],color:'#f59e0b'},
      {name:'Trial',stages:['trial'],color:'#14b8a6'},
      {name:'Live',stages:['live'],color:'#10b981'},
      {name:'Closed',stages:['closed'],color:'#dc2626'},
    ];
    const max=Math.max(...groups.map(g=>restaurants.filter(r=>g.stages.includes(r.stage)).length),1);
    return groups.map(g=>({...g,count:restaurants.filter(r=>g.stages.includes(r.stage)).length,max}));
  },[restaurants]);

  const recentActivities=activities.slice(0,5);

  return(
    <div>

          </button>
        </div>
        <div style={{padding:16}}>
          {!showQuickStage?(
            <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
              <select style={{...S.formInput,flex:'0 0 200px'}} value={selectedRest} onChange={e=>setSelectedRest(e.target.value)}>
                <option value="">Select restaurant...</option>
                {[...restaurants].sort((a,b)=>a.name.localeCompare(b.name)).map(r=><option key={r.id} value={r.id}>{r.name}</option>)}

              <div style={{display:'flex',gap:2,background:'#27272a',borderRadius:8,padding:2}}>
                {[{v:'note',l:'Note',icon:'edit'},{v:'call',l:'Call',icon:'phone'},{v:'email',l:'Email',icon:'mail'},{v:'meeting',l:'Meeting',icon:'calendar'}].map(t=>(
                  <button key={t.v} style={{...S.btn,background:quickType===t.v?'#3f3f46':'transparent',color:quickType===t.v?'#fafafa':'#71717a',border:'none',padding:'6px 12px',fontSize:12,borderRadius:6}} onClick={()=>setQuickType(t.v)}>
                    <I name={t.icon} size={13}/> {t.l}
                  </button>
                ))}
              </div>
              <input style={{...S.formInput,flex:1,minWidth:200}} value={quickNote} onChange={e=>setQuickNote(e.target.value)} placeholder={selectedRest?`Log ${quickType}... (Enter to save)`:"Select a restaurant first..."} disabled={!selectedRest} onKeyDown={e=>{if(e.key==='Enter')handleQuickLog()}}/>
              <button style={{...S.btn,...S.btnPrimary,opacity:(!selectedRest||!quickNote.trim())?0.5:1}} onClick={handleQuickLog} disabled={!selectedRest||!quickNote.trim()}><I name="plus" size={16}/> Log</button>
            </div>
          ):(
            <div>
              <div style={{fontSize:12,color:'#71717a',marginBottom:12}}>Click a stage to move a restaurant forward in the pipeline:</div>
              <div style={{display:'flex',flexDirection:'column',gap:8,maxHeight:200,overflowY:'auto'}}>
                {restaurants.filter(r=>!['live','closed'].includes(r.stage)).sort((a,b)=>STAGES.findIndex(s=>s.id===a.stage)-STAGES.findIndex(s=>s.id===b.stage)).slice(0,10).map(r=>{
                  const currentIdx=STAGES.findIndex(s=>s.id===r.stage);
                  const nextStage=currentIdx<STAGES.length-2?STAGES[currentIdx+1]:null;
                  return(
                    <div key={r.id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',background:'#1a1a1e',borderRadius:8}}>
                      <div style={{flex:1,fontSize:13,fontWeight:500}}>{r.name}</div>
                      <StageBadge stage={r.stage}/>
                      {nextStage&&<button style={{...S.btn,padding:'4px 10px',fontSize:11,background:`${nextStage.color}22`,color:nextStage.color,border:`1px solid ${nextStage.color}33`}} onClick={()=>handleQuickStage(r.id,nextStage.id)}>→ {nextStage.name}</button>}
                    </div>
                  );

              </div>
            </div>
          )}
        </div>
      </div>

      {/* Pipeline Summaries */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:16,marginBottom:24}}>
        {/* Restaurant Pipeline */}
        <div style={{...S.card,padding:16,cursor:'pointer',borderLeft:'3px solid #f97316'}} onClick={()=>setPage('pipeline')}>
          <div style={{fontSize:12,fontWeight:600,color:'#f97316',textTransform:'uppercase',letterSpacing:1,marginBottom:12}}>Restaurant Pipeline</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
            <div><div style={{fontSize:22,fontWeight:700,color:'#fafafa'}}>{stats.live}</div><div style={{fontSize:11,color:'#71717a'}}>Live clients</div></div>
            <div><div style={{fontSize:22,fontWeight:700,color:'#fafafa'}}>{stats.pipeline}</div><div style={{fontSize:11,color:'#71717a'}}>In pipeline</div></div>
            <div><div style={{fontSize:22,fontWeight:700,color:'#14b8a6'}}>{stats.trials}</div><div style={{fontSize:11,color:'#71717a'}}>Trials active</div></div>
            <div><div style={{fontSize:22,fontWeight:700,color:'#10b981'}}>{fmtCurrency(stats.mrr)}</div><div style={{fontSize:11,color:'#71717a'}}>Monthly MRR</div></div>
          </div>

        {/* Funding Pipeline */}
        <div style={{...S.card,padding:16,cursor:'pointer',borderLeft:'3px solid #8b5cf6'}} onClick={()=>setPage('funding')}>
          <div style={{fontSize:12,fontWeight:600,color:'#8b5cf6',textTransform:'uppercase',letterSpacing:1,marginBottom:12}}>Funding Pipeline</div>

        {/* My Progress */}
        <div style={S.card}>
          <div style={S.cardHead}><span style={S.cardTitle}>My Progress</span></div>

            {currentUser&&[

              {label:'Monthly MRR',val:myStats.mrr,target:currentUser.monthly_target_mrr,color:'#3b82f6',fmt:true},
              {label:'Weekly Conversations',val:myStats.conversations,target:currentUser.weekly_target_conversations,color:'#8b5cf6'},
              {label:'Monthly Trials',val:myStats.trials,target:currentUser.monthly_target_trials,color:'#14b8a6'},

                </div>
                <ProgressBar value={m.val} max={m.target} color={m.color}/>

          {recentActivities.length===0?<div style={S.empty}>No activity yet</div>:recentActivities.map(a=>{
            const r=restaurants.find(r=>r.id===a.restaurant_id);
            const typeColors={call:'#3b82f6',email:'#8b5cf6',meeting:'#f59e0b',note:'#71717a',stage_change:'#10b981',contact_linked:'#14b8a6',import:'#6b7280'};
            return(
              <div key={a.id} style={{display:'flex',gap:12,padding:'10px 8px',borderBottom:'1px solid #27272a'}}>

    </div>
  );
};

// ==================== PIPELINE (KANBAN) ====================
const Pipeline=()=>{
  const{data,currentUser,updateRestaurant,setPage}=useApp();
  const{restaurants,users}=data;
  const[dragId,setDragId]=useState(null);
  const[closeModal,setCloseModal]=useState(null);
  const[editId,setEditId]=useState(null);
  const[ownerFilter,setOwnerFilter]=useState('');

  const filtered=useMemo(()=>ownerFilter?restaurants.filter(r=>r.owner_id===ownerFilter):restaurants,[restaurants,ownerFilter]);

  const handleDragStart=(e,id)=>{e.dataTransfer.setData('text/plain',id);setDragId(id)};
  const handleDragOver=(e)=>{e.preventDefault();e.currentTarget.classList.add('drag-over')};
  const handleDragLeave=(e)=>{e.currentTarget.classList.remove('drag-over')};
  const handleDrop=(e,stageId)=>{
    e.preventDefault();e.currentTarget.classList.remove('drag-over');
    const id=e.dataTransfer.getData('text/plain');
    if(!id)return;
    const r=restaurants.find(r=>r.id===id);
    if(!r||r.stage===stageId)return;
    if(stageId==='closed'){setCloseModal({id,from:r.stage});return;}
    updateRestaurant(id,{stage:stageId});
    setDragId(null);
  };

  const getAgingColor=(r)=>{
    const stage=STAGE_MAP[r.stage];
    if(!stage||stage.targetDays===0)return null;
    const days=daysAgo(r.stage_entered_at);
    if(days===null)return null;
    if(days>stage.targetDays*1.5)return'#ef4444';
    if(days>stage.targetDays)return'#f59e0b';
    return'#22c55e';
  };

  return(
    <div>
      <div style={{display:'flex',gap:12,marginBottom:16,alignItems:'center'}}>
        <span style={{fontSize:13,color:'#71717a'}}>Filter by owner:</span>
        <select style={{...S.formInput,width:200,padding:'6px 10px',fontSize:13}} value={ownerFilter} onChange={e=>setOwnerFilter(e.target.value)}>
          <option value="">All team members</option>
          {users.map(u=><option key={u.id} value={u.id}>{u.full_name}</option>)}
        </select>
      </div>

      <div style={{display:'flex',gap:12,overflowX:'auto',paddingBottom:16}}>
        {STAGES.map(stage=>{
          const stageRests=filtered.filter(r=>r.stage===stage.id);
          const stageValue=stageRests.reduce((s,r)=>s+(parseFloat(r.target_mrr)||0),0);
          return(
            <div key={stage.id} style={S.kanbanCol} onDragOver={handleDragOver} onDragLeave={handleDragLeave} onDrop={e=>handleDrop(e,stage.id)}>
              <div style={S.kanbanHead}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{width:8,height:8,borderRadius:'50%',background:stage.color}}/>
                  <span style={{fontSize:13,fontWeight:600}}>{stage.name}</span>
                  <span style={{fontSize:11,color:'#71717a',background:'#27272a',padding:'1px 6px',borderRadius:10}}>{stageRests.length}</span>
                </div>
                <span style={{fontSize:11,color:'#71717a'}}>{fmtCurrency(stageValue)}</span>
              </div>
              <div style={S.kanbanBody}>
                {stageRests.map(r=>{
                  const days=daysAgo(r.stage_entered_at);
                  const agingColor=getAgingColor(r);
                  const owner=users.find(u=>u.id===r.owner_id);
                  return(
                    <div key={r.id} draggable onDragStart={e=>handleDragStart(e,r.id)} onDragEnd={()=>setDragId(null)}
                      style={{...S.kanbanCard,opacity:dragId===r.id?0.5:1,borderLeft:`3px solid ${stage.color}`}}
                      onClick={()=>setEditId(r.id)}>
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
                        <div style={{fontSize:13,fontWeight:600,flex:1}}>{r.name}</div>
                        {owner&&<Avatar name={owner.full_name} size={22}/>}
                      </div>
                      {r.group_name&&<div style={{fontSize:11,color:'#71717a',marginBottom:4}}>{r.group_name}</div>}
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:6}}>
                        <span style={{fontSize:12,fontWeight:600,color:stage.color}}>{fmtCurrency(r.target_mrr)}/mo</span>
                        {days!==null&&<span style={{fontSize:11,color:agingColor||'#71717a'}}>{days}d</span>}
                      </div>
                      {r.next_action_date&&(
                        <div style={{marginTop:6,fontSize:11,color:'#71717a',display:'flex',alignItems:'center',gap:4}}>
                          <I name="calendar" size={10}/> {r.next_action_type}: {fmtDate(r.next_action_date)}
                        </div>
                      )}
                      {r.stage==='closed'&&r.close_reason&&(
                        <div style={{marginTop:6,fontSize:11,color:'#ef4444'}}>{r.close_reason}</div>
                      )}
                    </div>
                  );
                })}
                {stageRests.length===0&&<div style={{textAlign:'center',padding:20,fontSize:12,color:'#3f3f46'}}>No restaurants</div>}
              </div>
            </div>
          );
        })}
      </div>

      {closeModal&&<CloseReasonModal onConfirm={(reason)=>{updateRestaurant(closeModal.id,{stage:'closed',close_reason:reason});setCloseModal(null);setDragId(null)}} onCancel={()=>{setCloseModal(null);setDragId(null)}}/>}
      {editId&&<RestaurantModal id={editId} onClose={()=>setEditId(null)}/>}
    </div>
  );
};

// ==================== RESTAURANT MODAL ====================
const RestaurantModal=({id,onClose,isNew})=>{
  const{data,currentUser,updateRestaurant,addRestaurant,deleteRestaurant}=useApp();
  const existing=id?data.restaurants.find(r=>r.id===id):null;
  const blank={name:'',group_name:'',stage:'identified',close_reason:'',owner_id:currentUser?.id||'',website:'',postcode:'',tables:'',target_mrr:'',booking_system:'',trial_start_date:'',trial_end_date:'',next_action_date:'',next_action_type:'',notes:'',linkedin_url:''};
  const[form,setForm]=useState(existing||blank);
  const[showClose,setShowClose]=useState(false);
  const[showDelete,setShowDelete]=useState(false);
  const[tab,setTab]=useState('details');
  const isAdmin=currentUser?.role==='admin';

  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const handleSave=()=>{
    if(!form.name.trim())return;
    if(isNew||!id){addRestaurant(form);onClose();return;}
    if(form.stage==='closed'&&existing.stage!=='closed'&&!form.close_reason){setShowClose(true);return;}
    updateRestaurant(id,form);onClose();
  };

  // Linked contacts
  const linkedCRs=id?data.contact_restaurants.filter(cr=>cr.restaurant_id===id):[];
  const linkedContacts=linkedCRs.map(cr=>({...cr,contact:data.contacts.find(c=>c.id===cr.contact_id)})).filter(lc=>lc.contact);

  // Activities for this restaurant
  const restActivities=id?data.activities.filter(a=>a.restaurant_id===id).slice(0,10):[];

  return(
    <Modal title={isNew?'Add Restaurant':form.name} onClose={onClose} wide footer={
      <div style={{display:'flex',justifyContent:'space-between',width:'100%'}}>
        <div>{!isNew&&isAdmin&&<button style={{...S.btn,...S.btnDanger,...S.btnSm}} onClick={()=>setShowDelete(true)}><I name="trash" size={14}/> Delete</button>}</div>
        <div style={{display:'flex',gap:8}}>
          <button style={{...S.btn,...S.btnSecondary}} onClick={onClose}>Cancel</button>
          <button style={{...S.btn,...S.btnPrimary}} onClick={handleSave}>Save</button>
        </div>
      </div>
    }>
      {/* Tabs */}
      {!isNew&&<div style={{display:'flex',gap:4,marginBottom:20,borderBottom:'1px solid #27272a',paddingBottom:8}}>
        {['details','contacts','activity'].map(t=>(
          <button key={t} style={{...S.btn,...S.btnGhost,color:tab===t?'#f97316':'#71717a',borderBottom:tab===t?'2px solid #f97316':'2px solid transparent',borderRadius:0,paddingBottom:8}} onClick={()=>setTab(t)}>{t.charAt(0).toUpperCase()+t.slice(1)}</button>
        ))}
      </div>}

      {tab==='details'&&<>
        <div style={S.formSection}>
          <div style={S.formSectionTitle}>Restaurant Info</div>
          <div style={S.formGrid}>
            <div style={S.formGroup}><label style={S.formLabel}>Name *</label><input style={S.formInput} value={form.name} onChange={e=>set('name',e.target.value)}/></div>
            <div style={S.formGroup}><label style={S.formLabel}>Group</label><input style={S.formInput} value={form.group_name} onChange={e=>set('group_name',e.target.value)} placeholder="e.g. Dishoom"/></div>
            <div style={S.formGroup}><label style={S.formLabel}>Website</label><input style={S.formInput} value={form.website} onChange={e=>set('website',e.target.value)}/></div>
            <div style={S.formGroup}><label style={S.formLabel}>Postcode</label><input style={S.formInput} value={form.postcode} onChange={e=>set('postcode',e.target.value)}/></div>
            <div style={S.formGroup}><label style={S.formLabel}>Covers</label><input style={S.formInput} type="number" value={form.tables} onChange={e=>set('tables',e.target.value)}/></div>
            <div style={S.formGroup}><label style={S.formLabel}>Target MRR (£)</label><input style={S.formInput} type="number" value={form.target_mrr} onChange={e=>set('target_mrr',e.target.value)}/></div>
            <div style={S.formGroup}><label style={S.formLabel}>Booking System</label><SelectInput value={form.booking_system} onChange={v=>set('booking_system',v)} options={BOOKING_SYSTEMS} placeholder="Select..."/></div>
            <div style={S.formGroup}><label style={S.formLabel}>LinkedIn URL</label><input style={S.formInput} value={form.linkedin_url} onChange={e=>set('linkedin_url',e.target.value)}/></div>
          </div>
        </div>

        <div style={S.formSection}>
          <div style={S.formSectionTitle}>Pipeline</div>
          <div style={S.formGrid}>
            <div style={S.formGroup}><label style={S.formLabel}>Stage</label>
              <select style={S.formInput} value={form.stage} onChange={e=>{
                const ns=e.target.value;
                if(ns==='closed'&&form.stage!=='closed'){setShowClose(true);return;}
                set('stage',ns);
              }}>
                {STAGES.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
            </div>
            <div style={S.formGroup}><label style={S.formLabel}>Owner</label>
              <select style={S.formInput} value={form.owner_id} onChange={e=>set('owner_id',e.target.value)}>
                {data.users.map(u=><option key={u.id} value={u.id}>{u.full_name}</option>)}
              </select>
            </div>
            {form.stage==='closed'&&<div style={{...S.formGroup,gridColumn:'span 2'}}><label style={S.formLabel}>Close Reason</label>
              <SelectInput value={form.close_reason} onChange={v=>set('close_reason',v)} options={CLOSE_REASONS} placeholder="Select reason..."/>
            </div>}
          </div>
        </div>

        <div style={S.formSection}>
          <div style={S.formSectionTitle}>Actions & Trial</div>
          <div style={S.formGrid}>
            <div style={S.formGroup}><label style={S.formLabel}>Next Action Date</label><input style={S.formInput} type="date" value={form.next_action_date} onChange={e=>set('next_action_date',e.target.value)}/></div>
            <div style={S.formGroup}><label style={S.formLabel}>Next Action Type</label><SelectInput value={form.next_action_type} onChange={v=>set('next_action_type',v)} options={ACTION_TYPES} placeholder="Select..."/></div>
            <div style={S.formGroup}><label style={S.formLabel}>Trial Start</label><input style={S.formInput} type="date" value={form.trial_start_date} onChange={e=>set('trial_start_date',e.target.value)}/></div>
            <div style={S.formGroup}><label style={S.formLabel}>Trial End</label><input style={S.formInput} type="date" value={form.trial_end_date} onChange={e=>set('trial_end_date',e.target.value)}/></div>
          </div>
        </div>

        <div style={S.formGroup}><label style={S.formLabel}>Notes</label><textarea style={S.formTextarea} value={form.notes} onChange={e=>set('notes',e.target.value)} rows={3}/></div>
      </>}

      {tab==='contacts'&&(
        <div>
          {linkedContacts.length===0?<EmptyState icon="users" message="No contacts linked to this restaurant"/>:
            linkedContacts.map(lc=>(
              <div key={lc.id} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 0',borderBottom:'1px solid #27272a'}}>
                <Avatar name={lc.contact.full_name} size={36}/>
                <div style={{flex:1}}>
                  <div style={{fontWeight:500,fontSize:14}}>{lc.contact.full_name}</div>
                  <div style={{fontSize:12,color:'#71717a'}}>{lc.contact.job_title} · {lc.contact.company}</div>
                  <div style={{display:'flex',gap:4,marginTop:4,flexWrap:'wrap'}}>{lc.role_tags.map(t=><TagBadge key={t} tag={t} active/>)}</div>
                </div>
                {lc.is_primary&&<span style={{...S.badge,background:'rgba(249,115,22,0.15)',color:'#f97316',fontSize:10}}>Primary</span>}
              </div>
            ))
          }
        </div>
      )}

      {tab==='activity'&&(
        <div>
          {restActivities.length===0?<EmptyState icon="activity" message="No activity yet"/>:
            restActivities.map(a=>{
              const typeColors={call:'#3b82f6',email:'#8b5cf6',meeting:'#f59e0b',note:'#71717a',stage_change:'#10b981',contact_linked:'#14b8a6'};
              return(
                <div key={a.id} style={{display:'flex',gap:12,padding:'10px 0',borderBottom:'1px solid #27272a'}}>
                  <div style={{width:8,height:8,borderRadius:'50%',background:typeColors[a.type]||'#71717a',marginTop:6,flexShrink:0}}/>
                  <div>
                    <div style={{fontSize:13,fontWeight:500}}>{a.subject}</div>
                    {a.body&&<div style={{fontSize:12,color:'#a1a1aa',marginTop:2}}>{a.body}</div>}
                    <div style={{fontSize:11,color:'#71717a',marginTop:2}}>{fmtDate(a.occurred_at)}</div>
                  </div>
                </div>
              );
            })
          }
        </div>
      )}

      {showClose&&<CloseReasonModal onConfirm={(reason)=>{set('stage','closed');set('close_reason',reason);setShowClose(false)}} onCancel={()=>setShowClose(false)}/>}
      {showDelete&&<ConfirmModal title="Delete Restaurant" message={`Are you sure you want to delete "${form.name}"? This cannot be undone.`} danger onConfirm={()=>{deleteRestaurant(id);onClose()}} onCancel={()=>setShowDelete(false)}/>}
    </Modal>
  );
};

// ==================== RESTAURANTS LIST ====================
const RestaurantsList=()=>{
  const{data,currentUser}=useApp();
  const{restaurants,users}=data;
  const[search,setSearch]=useState('');
  const[stageFilter,setStageFilter]=useState('');
  const[ownerFilter,setOwnerFilter]=useState('');
  const[sortCol,setSortCol]=useState('name');
  const[sortDir,setSortDir]=useState('asc');
  const[editId,setEditId]=useState(null);
  const[showAdd,setShowAdd]=useState(false);

  const filtered=useMemo(()=>{
    let list=restaurants;
    if(search){const q=search.toLowerCase();list=list.filter(r=>r.name.toLowerCase().includes(q)||r.group_name?.toLowerCase().includes(q)||r.postcode?.toLowerCase().includes(q));}
    if(stageFilter)list=list.filter(r=>r.stage===stageFilter);
    if(ownerFilter)list=list.filter(r=>r.owner_id===ownerFilter);
    list=[...list].sort((a,b)=>{
      let av,bv;
      switch(sortCol){
        case'name':av=a.name.toLowerCase();bv=b.name.toLowerCase();break;
        case'group':av=(a.group_name||'').toLowerCase();bv=(b.group_name||'').toLowerCase();break;
        case'stage':av=STAGES.findIndex(s=>s.id===a.stage);bv=STAGES.findIndex(s=>s.id===b.stage);break;
        case'mrr':av=parseFloat(a.target_mrr)||0;bv=parseFloat(b.target_mrr)||0;break;
        case'days':av=daysAgo(a.stage_entered_at)||0;bv=daysAgo(b.stage_entered_at)||0;break;
        case'owner':av=(users.find(u=>u.id===a.owner_id)?.full_name||'').toLowerCase();bv=(users.find(u=>u.id===b.owner_id)?.full_name||'').toLowerCase();break;
        default:av=a.name;bv=b.name;
      }
      if(av<bv)return sortDir==='asc'?-1:1;
      if(av>bv)return sortDir==='asc'?1:-1;
      return 0;
    });
    return list;
  },[restaurants,search,stageFilter,ownerFilter,sortCol,sortDir,users]);

  const handleSort=(col)=>{
    if(sortCol===col)setSortDir(d=>d==='asc'?'desc':'asc');
    else{setSortCol(col);setSortDir('asc');}
  };
  const SortIcon=({col})=>sortCol===col?<span style={{marginLeft:4,fontSize:10}}>{sortDir==='asc'?'▲':'▼'}</span>:null;

  return(
    <div>
      <div style={{display:'flex',gap:12,marginBottom:20,alignItems:'center',flexWrap:'wrap'}}>
        <SearchBar value={search} onChange={setSearch} placeholder="Search restaurants..."/>
        <select style={{...S.formInput,width:160,padding:'8px 12px'}} value={stageFilter} onChange={e=>setStageFilter(e.target.value)}>
          <option value="">All stages</option>
          {STAGES.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
        <select style={{...S.formInput,width:160,padding:'8px 12px'}} value={ownerFilter} onChange={e=>setOwnerFilter(e.target.value)}>
          <option value="">All owners</option>
          {users.map(u=><option key={u.id} value={u.id}>{u.full_name}</option>)}
        </select>
        <div style={{flex:1}}/>
        <span style={{fontSize:13,color:'#71717a'}}>{filtered.length} restaurants</span>
        <button style={{...S.btn,...S.btnPrimary}} onClick={()=>setShowAdd(true)}><I name="plus" size={16}/> Add Restaurant</button>
      </div>

      <div style={S.card}>
        <table style={S.table}>
          <thead><tr>
            <th style={S.th} onClick={()=>handleSort('name')}><span style={{cursor:'pointer'}}>Name<SortIcon col="name"/></span></th>

// ---- Hospitality matching engine ----

// Company keywords: must be specific enough to indicate an actual venue/operator
const HOSP_COMPANY_KW=['restaurant','restaurants','ristorante','trattoria','osteria','enoteca','brasserie','bistro','pizzeria','steakhouse','chophouse','smokehouse','carvery','tapas','izakaya','cantina','boulangerie','patisserie','gelateria','creperie','pub ','pubs','the pub','gastropub','tavern','ale house','alehouse','inn ','brewery','microbrewery','brewpub','bar ','bars','wine bar','cocktail bar','cocktail','speakeasy','lounge bar','rooftop bar','cafe ','cafes','coffee house','coffeehouse','tea room','tearoom','bakery','deli ','delicatessen','canteen','diner ','eatery','food hall','street food','supper club','grill ','grille','bbq','barbecue','burger','taco','ramen','sushi','noodle','wok ','dim sum','shawarma','kebab','curry house','tandoori','fish and chips','fish & chips','oyster bar','seafood','ceviche','mezze','hotel','hotels','boutique hotel','hospitality group','catering','event catering','banqueting'];

// Position: only compound hospitality-specific titles — no generic words like "manager" or "director"
const HOSP_POSITION_KW=['head chef','chef de','sous chef','executive chef','pastry chef','chef patron','chef owner','chef director','line cook','commis chef','sommelier','maitre d','front of house manager','foh manager','restaurant manager','restaurant director','restaurant owner','bar manager','pub manager','hotel manager','hotel director','kitchen manager','kitchen director','catering manager','catering director','hospitality manager','hospitality director','f&b manager','f&b director','food and beverage manager','food and beverage director','food & beverage','general manager hospitality','general manager restaurant','general manager hotel','head of hospitality','head bartender','head waiter','head sommelier','mixologist','barista','bartender','publican','hotelier','concierge','dining room manager','banquet manager','events manager hotel','events manager restaurant'];

// False positive blockers — companies that contain hospitality words but aren't venues
const COMPANY_BLOCKLIST=['capital','ventures','venture','consulting','consultancy','advisor','advisory','council','software','tech','technology','technologies','digital','media','agency','marketing','analytics','research','institute','university','college','school','academy','labs','laboratory','fund','partners','investment','financial','insurance','legal','law firm','recruitment','staffing','pharma','biotech','engineering','architects','design studio','data','cloud','platform','solutions','services group','management consulting','strategy'];

// ---- Investor matching engine ----
const INVESTOR_COMPANY_KW=['venture capital','vc ','ventures','venture partner','angel','seed fund','growth fund','investment fund','capital partners','capital management','family office','accelerator','incubator','early stage','pre-seed','series a','startup fund','fund manager','private equity','impact fund','syndicate','foodtech fund','hospitality fund','restaurant fund','f&b fund'];
const INVESTOR_POSITION_KW=['venture partner','general partner','managing partner','investment director','investment manager','investment associate','investment analyst','principal','fund manager','angel investor','venture capitalist','partner at','head of investments','portfolio manager','deal flow','fundraising','investor relations','limited partner'];
const INVESTOR_BLOCKLIST=['recruitment','staffing','hr ','human resources','real estate','property','insurance','law firm','legal'];

// ---- Partner matching engine ----
const PARTNER_COMPANY_KW=['booking system','reservation','opentable','resdiary','thefork','quandoo','resy','sevenrooms','tablein','pos ','point of sale','epos','lightspeed','square','toast pos','clover','zettle','sumup','stripe','deliveroo','uber eats','just eat','food delivery','takeaway','hospitality tech','restaurant tech','restaurant software','menu','digital menu','qr code','loyalty','crm','marketing platform','review','tripadvisor','google business','hospitality platform','food tech','foodtech','kitchen','inventory','procurement','supplier','wholesale','restaurant supply'];
const PARTNER_POSITION_KW=['partnerships manager','partnership director','head of partnerships','business development manager','bd manager','channel manager','strategic partnerships','alliance manager','partner manager','integration manager','head of integrations','api partnerships','platform partnerships','ecosystem','marketplace manager','head of sales','sales director hospitality','account executive hospitality'];

// Word-boundary aware keyword check
const kwMatch=(text,keywords)=>{
  const t=' '+text.toLowerCase()+' ';
  return keywords.filter(kw=>{
    const k=kw.toLowerCase();
    // For short keywords ending with space (like 'bar '), match with boundary
    if(k.endsWith(' '))return t.includes(' '+k)||t.includes(k);
    return t.includes(k);
  });
};

const isBlocklisted=(company)=>{
  const c=company.toLowerCase();
  return COMPANY_BLOCKLIST.some(bl=>c.includes(bl));
};

const matchReasons=(contact,restaurants)=>{
  const results=[];
  const comp=(contact.company||'').toLowerCase().trim();
  const pos=(contact.position||'').toLowerCase().trim();
  if(!comp)return results;

  restaurants.forEach(r=>{
    const rName=r.name.toLowerCase();
    const rGroup=(r.group_name||'').toLowerCase();
    const reasons=[];

    // Exact match on restaurant name
    if(comp===rName)reasons.push({type:'exact_name',strength:'high',text:`Company "${contact.company}" exactly matches restaurant "${r.name}"`});
    // Exact match on group name
    else if(rGroup&&comp===rGroup)reasons.push({type:'exact_group',strength:'high',text:`Company "${contact.company}" exactly matches group "${r.group_name}"`});
    // Restaurant name contained in company (min 5 chars to avoid tiny false matches)
    else if(rName.length>=5&&comp.includes(rName))reasons.push({type:'partial',strength:'medium',text:`Restaurant name "${r.name}" found within company "${contact.company}"`});
    // Company contained in restaurant name (min 5 chars)
    else if(comp.length>=5&&rName.includes(comp))reasons.push({type:'partial',strength:'medium',text:`Company "${contact.company}" found within restaurant name "${r.name}"`});
    // Group name partial (min 5 chars)
    else if(rGroup&&rGroup.length>=5&&(comp.includes(rGroup)||rGroup.includes(comp)))reasons.push({type:'partial_group',strength:'medium',text:`Group "${r.group_name}" matches company "${contact.company}"`});

    // Position relevance bonus (compound terms only)
    const posHits=kwMatch(pos,HOSP_POSITION_KW);
    if(reasons.length>0&&posHits.length>0){
      reasons.push({type:'position',strength:'bonus',text:`Position "${contact.position}" matches: ${posHits.join(', ')}`});
    }

    if(reasons.length>0){
      const strength=reasons.some(r=>r.strength==='high')?'high':'medium';
      results.push({restaurant:r,reasons,strength});
    }
  });

  return results;
};

const isHospitalityContact=(contact)=>{
  const comp=(contact.company||'').toLowerCase();
  const pos=(contact.position||'').toLowerCase();
  if(!comp&&!pos)return{isHosp:false,compHits:[],posHits:[],confidence:'none'};

  // Check blocklist first
  if(comp&&isBlocklisted(comp))return{isHosp:false,compHits:[],posHits:[],confidence:'none'};

  const compHits=kwMatch(comp,HOSP_COMPANY_KW);
  const posHits=kwMatch(pos,HOSP_POSITION_KW);
  const bothMatch=compHits.length>0&&posHits.length>0;
  const compOnly=compHits.length>0&&posHits.length===0;
  const posOnly=posHits.length===0&&posHits.length>0;

  // Require either: both company+position match, OR company matches with 2+ keywords, OR position matches a strong hospitality term
  const isHosp=bothMatch||compHits.length>=2||posHits.length>0;
  const confidence=bothMatch?'high':(compHits.length>=2||posHits.length>0)?'medium':'low';
  return{isHosp,compHits,posHits,confidence};
};

const isInvestorContact=(contact)=>{
  const comp=(contact.company||'').toLowerCase();
  const pos=(contact.position||'').toLowerCase();
  if(!comp&&!pos)return{isInvestor:false,compHits:[],posHits:[],confidence:'none'};
  if(comp&&INVESTOR_BLOCKLIST.some(bl=>comp.includes(bl)))return{isInvestor:false,compHits:[],posHits:[],confidence:'none'};
  const compHits=kwMatch(comp,INVESTOR_COMPANY_KW);
  const posHits=kwMatch(pos,INVESTOR_POSITION_KW);
  const bothMatch=compHits.length>0&&posHits.length>0;
  const isInvestor=bothMatch||compHits.length>=2||posHits.length>0;
  const confidence=bothMatch?'high':(compHits.length>=2||posHits.length>0)?'medium':'low';
  return{isInvestor,compHits,posHits,confidence};
};

const isPartnerContact=(contact)=>{
  const comp=(contact.company||'').toLowerCase();
  const pos=(contact.position||'').toLowerCase();
  if(!comp&&!pos)return{isPartner:false,compHits:[],posHits:[],confidence:'none'};
  const compHits=kwMatch(comp,PARTNER_COMPANY_KW);
  const posHits=kwMatch(pos,PARTNER_POSITION_KW);
  const bothMatch=compHits.length>0&&posHits.length>0;
  const isPartner=bothMatch||compHits.length>=2||posHits.length>0;
  const confidence=bothMatch?'high':(compHits.length>=2||posHits.length>0)?'medium':'low';
  return{isPartner,compHits,posHits,confidence};
};

const generateOutreachBlurb=(contact,restaurant)=>{
  const first=contact.firstName||contact.fullName.split(' ')[0];
  const pos=contact.position?` — saw you're ${contact.position}${contact.company?' at '+contact.company:''}. `:`! `;
  if(restaurant){
    return`Hi ${first}${pos}We're working with ${restaurant.name} and thought there might be a nice synergy with what we do at Remy AI — we help restaurants handle bookings and guest comms with AI. Would love to chat if you're open to it!`;
  }
  return`Hi ${first}${pos}I came across your profile and thought you might find what we're building at Remy AI interesting — we help restaurants handle bookings and guest communication with AI. Would be great to connect!`;
};

// Steps: 1=upload, 2=review pipeline matches, 3=review hospitality contacts, 4=import summary
const LinkedInPage=()=>{
  const{data,addContact,linkContact,addActivity,currentUser,showToast,setPage}=useApp();
  const[step,setStep]=useState(1);
  const[allParsed,setAllParsed]=useState([]);
  const[pipelineMatches,setPipelineMatches]=useState([]);
  const[hospContacts,setHospContacts]=useState([]);
  const[investorContacts,setInvestorContacts]=useState([]);
  const[partnerContacts,setPartnerContacts]=useState([]);
  const[reviewIdx,setReviewIdx]=useState(0);
  const[hospReviewIdx,setHospReviewIdx]=useState(0);
  const[invReviewIdx,setInvReviewIdx]=useState(0);
  const[partReviewIdx,setPartReviewIdx]=useState(0);
  const[decisions,setDecisions]=useState({});
  const[hospDecisions,setHospDecisions]=useState({});
  const[invDecisions,setInvDecisions]=useState({});
  const[partDecisions,setPartDecisions]=useState({});
  const[blurbs,setBlurbs]=useState({});
  const[hospBlurbs,setHospBlurbs]=useState({});
  const[importedCount,setImportedCount]=useState(0);
  const[dragActive,setDragActive]=useState(false);
  const fileRef=useRef(null);

  const parseCSVRow=(row)=>{
    const cols=[];let cur='';let inQ=false;
    for(let i=0;i<row.length;i++){
      const ch=row[i];
      if(ch==='"'){inQ=!inQ}
      else if(ch===','&&!inQ){cols.push(cur.trim());cur=''}
      else{cur+=ch}
    }
    cols.push(cur.trim());
    return cols;
  };

  const parseCSV=(text)=>{
    const lines=text.split('\n').map(l=>l.trim()).filter(l=>l);
    if(lines.length<2)return[];
    let headerIdx=lines.findIndex(l=>/^first\s*name/i.test(l));
    if(headerIdx<0)headerIdx=lines.findIndex(l=>l.toLowerCase().includes('first name')&&l.toLowerCase().includes('last name'));
    if(headerIdx<0)headerIdx=0;
    const headers=parseCSVRow(lines[headerIdx]).map(h=>h.replace(/"/g,''));
    const fnIdx=headers.findIndex(h=>h.toLowerCase().includes('first'));
    const lnIdx=headers.findIndex(h=>h.toLowerCase().includes('last'));
    const emailIdx=headers.findIndex(h=>h.toLowerCase().includes('email'));
    const companyIdx=headers.findIndex(h=>h.toLowerCase().includes('company'));
    const posIdx=headers.findIndex(h=>h.toLowerCase().includes('position'));
    const urlIdx=headers.findIndex(h=>h.toLowerCase()==='url');
    const dateIdx=headers.findIndex(h=>h.toLowerCase().includes('connected'));

    return lines.slice(headerIdx+1).map(line=>{
      const cols=parseCSVRow(line);
      const firstName=fnIdx>=0?cols[fnIdx]||'':'';
      const lastName=lnIdx>=0?cols[lnIdx]||'':'';
      const email=emailIdx>=0?cols[emailIdx]||'':'';
      const company=companyIdx>=0?cols[companyIdx]||'':'';
      const position=posIdx>=0?cols[posIdx]||'':'';
      const linkedinUrl=urlIdx>=0?cols[urlIdx]||'':'';
      const connDate=dateIdx>=0?cols[dateIdx]||'':'';
      const fullName=`${firstName} ${lastName}`.trim();
      if(!fullName)return null;
      const alreadyExists=data.contacts.some(c=>c.full_name.toLowerCase()===fullName.toLowerCase()||(email&&c.email?.toLowerCase()===email.toLowerCase()));
      return{firstName,lastName,fullName,email,company,position,linkedinUrl,connDate,alreadyExists};
    }).filter(Boolean);
  };

  const handleFile=(file)=>{
    if(!file)return;
    const reader=new FileReader();
    reader.onload=(e)=>{
      const all=parseCSV(e.target.result);
      setAllParsed(all);

      // Step 1: find pipeline matches (contacts whose company matches a CRM restaurant)
      const pm=[];
      const hospOnly=[];
      const seen=new Set();
      all.forEach((c,idx)=>{
        if(c.alreadyExists)return;
        const matches=matchReasons(c,data.restaurants);
        if(matches.length>0){
          pm.push({...c,idx,matches,bestMatch:matches.sort((a,b)=>a.strength==='high'?-1:1)[0]});
          seen.add(idx);
        }
      });

      // Step 2: find hospitality, investor, and partner contacts not already matched
      const invOnly=[];const partOnly=[];
      all.forEach((c,idx)=>{
        if(c.alreadyExists||seen.has(idx))return;
        const{isHosp,compHits,posHits,confidence}=isHospitalityContact(c);
        if(isHosp){
          const hospReason=[];
          if(compHits.length>0)hospReason.push(`Company "${c.company}" matches: ${compHits.join(', ')}`);
          if(posHits.length>0)hospReason.push(`Position "${c.position}" matches: ${posHits.join(', ')}`);
          if(compHits.length>0&&posHits.length>0)hospReason.push('Both company and position signal hospitality — high confidence');
          hospOnly.push({...c,idx,hospReason,confidence});
          seen.add(idx);
          return;
        }
        const inv=isInvestorContact(c);
        if(inv.isInvestor){
          const reasons=[];
          if(inv.compHits.length>0)reasons.push(`Company "${c.company}" matches: ${inv.compHits.join(', ')}`);
          if(inv.posHits.length>0)reasons.push(`Position "${c.position}" matches: ${inv.posHits.join(', ')}`);
          invOnly.push({...c,idx,reasons,confidence:inv.confidence});
          seen.add(idx);
          return;
        }
        const par=isPartnerContact(c);
        if(par.isPartner){
          const reasons=[];
          if(par.compHits.length>0)reasons.push(`Company "${c.company}" matches: ${par.compHits.join(', ')}`);
          if(par.posHits.length>0)reasons.push(`Position "${c.position}" matches: ${par.posHits.join(', ')}`);
          partOnly.push({...c,idx,reasons,confidence:par.confidence});
          seen.add(idx);
        }
      });
      hospOnly.sort((a,b)=>a.confidence==='high'?-1:b.confidence==='high'?1:0);
      invOnly.sort((a,b)=>a.confidence==='high'?-1:b.confidence==='high'?1:0);
      partOnly.sort((a,b)=>a.confidence==='high'?-1:b.confidence==='high'?1:0);

      setPipelineMatches(pm);
      setHospContacts(hospOnly);
      setInvestorContacts(invOnly);
      setPartnerContacts(partOnly);

      const b={};pm.forEach((p,i)=>{b[i]=generateOutreachBlurb(p,p.bestMatch.restaurant)});
      setBlurbs(b);
      const hb={};hospOnly.forEach((p,i)=>{hb[i]=generateOutreachBlurb(p,null)});
      setHospBlurbs(hb);

      setStep(2);
    };
    reader.readAsText(file);
  };

  const handleDrop=(e)=>{
    e.preventDefault();setDragActive(false);
    const file=e.dataTransfer.files[0];
    if(file&&file.name.endsWith('.csv'))handleFile(file);
  };

  const decideMatch=(idx,decision)=>{
    setDecisions(d=>({...d,[idx]:decision}));
    if(idx<pipelineMatches.length-1)setReviewIdx(idx+1);
  };

  const decideHosp=(idx,decision)=>{
    setHospDecisions(d=>({...d,[idx]:decision}));
    if(idx<hospContacts.length-1)setHospReviewIdx(idx+1);
  };

  const doImport=()=>{
    let count=0;
    // Import approved pipeline matches
    pipelineMatches.forEach((p,i)=>{
      if(decisions[i]!=='approve')return;
      const newC=addContact({full_name:p.fullName,email:p.email,phone:'',mobile:'',job_title:p.position,company:p.company,global_tags:[],linkedin_url:p.linkedinUrl||'',source:'linkedin_import',notes:`Connected on LinkedIn: ${p.connDate}\n\nSuggested outreach:\n${blurbs[i]||''}`});
      if(newC&&p.bestMatch){
        linkContact(newC.id,p.bestMatch.restaurant.id,['influencer'],false,`LinkedIn import — works at ${p.company}`);
      }
      count++;
    });
    // Import approved hospitality contacts
    hospContacts.forEach((p,i)=>{
      if(hospDecisions[i]!=='approve')return;
      addContact({full_name:p.fullName,email:p.email,phone:'',mobile:'',job_title:p.position,company:p.company,global_tags:[],linkedin_url:p.linkedinUrl||'',source:'linkedin_import',notes:`Connected on LinkedIn: ${p.connDate}\nCategory: Hospitality`});
      count++;
    });
    // Import approved investor contacts
    investorContacts.forEach((p,i)=>{
      if(invDecisions[i]!=='approve')return;
      addContact({full_name:p.fullName,email:p.email,phone:'',mobile:'',job_title:p.position,company:p.company,global_tags:['investor'],linkedin_url:p.linkedinUrl||'',source:'linkedin_import',notes:`Connected on LinkedIn: ${p.connDate}\nCategory: Investor`});
      count++;
    });
    // Import approved partner contacts
    partnerContacts.forEach((p,i)=>{
      if(partDecisions[i]!=='approve')return;
      addContact({full_name:p.fullName,email:p.email,phone:'',mobile:'',job_title:p.position,company:p.company,global_tags:['referrer'],linkedin_url:p.linkedinUrl||'',source:'linkedin_import',notes:`Connected on LinkedIn: ${p.connDate}\nCategory: Partner`});
      count++;
    });
    if(count>0){
      addActivity({restaurant_id:'',contact_id:'',type:'import',subject:`LinkedIn import: ${count} contacts`,body:`Imported ${count} contacts from LinkedIn CSV (reviewed individually)`,occurred_at:new Date().toISOString(),metadata:{count}});
    }
    setImportedCount(count);
    setStep(5);
    showToast(`Imported ${count} contacts`);
  };

  const approvedPipeline=Object.values(decisions).filter(d=>d==='approve').length;
  const approvedHosp=Object.values(hospDecisions).filter(d=>d==='approve').length;
  const approvedInv=Object.values(invDecisions).filter(d=>d==='approve').length;
  const approvedPart=Object.values(partDecisions).filter(d=>d==='approve').length;
  const totalApproved=approvedPipeline+approvedHosp+approvedInv+approvedPart;

  const decideInv=(idx,decision)=>{setInvDecisions(d=>({...d,[idx]:decision}));if(idx<investorContacts.length-1)setInvReviewIdx(idx+1)};
  const decidePart=(idx,decision)=>{setPartDecisions(d=>({...d,[idx]:decision}));if(idx<partnerContacts.length-1)setPartReviewIdx(idx+1)};

  const steps=[
    {n:1,label:'Upload'},
    {n:2,label:'Pipeline'},
    {n:3,label:'Hospitality'},
    {n:3.5,label:'Investors'},
    {n:3.7,label:'Partners'},
    {n:4,label:'Confirm'},
    {n:5,label:'Done'}
  ];

  const StepBar=()=>(
    <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:28}}>
      {steps.map((s,i)=>{
        const active=step===s.n;
        const done=step>s.n;
        return <React.Fragment key={s.n}>
          {i>0&&<div style={{flex:1,height:2,background:done?'#f97316':'#27272a',borderRadius:1}}/>}
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <div style={{width:28,height:28,borderRadius:14,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:600,background:active?'#f97316':done?'rgba(249,115,22,0.2)':'#27272a',color:active?'#fff':done?'#f97316':'#52525b',border:active?'2px solid #f97316':'2px solid transparent'}}>{done?'\u2713':s.n}</div>
            <span style={{fontSize:12,color:active?'#f5f5f5':done?'#a1a1aa':'#52525b',fontWeight:active?600:400,display:window.innerWidth<600?'none':'inline'}}>{s.label}</span>
          </div>
        </React.Fragment>;
      })}
    </div>
  );

  const StrengthBadge=({strength})=>(
    <span style={{...S.badge,background:strength==='high'?'rgba(16,185,129,0.15)':'rgba(245,158,11,0.15)',color:strength==='high'?'#10b981':'#f59e0b',fontSize:11}}>{strength==='high'?'Strong match':'Partial match'}</span>
  );

  // ========== STEP 1: Upload ==========
  if(step===1)return(
    <div>
      <StepBar/>
      <div style={{marginBottom:24}}>
        <h3 style={{fontSize:16,fontWeight:600,marginBottom:8}}>Import LinkedIn Connections</h3>
        <p style={{fontSize:13,color:'#71717a',lineHeight:1.6,marginBottom:12}}>Upload your LinkedIn Connections.csv to find contacts relevant to your restaurant pipeline.</p>
        <div style={{fontSize:13,color:'#a1a1aa',lineHeight:1.8,background:'#18181b',border:'1px solid #27272a',borderRadius:8,padding:16}}>
          <strong style={{color:'#f5f5f5'}}>How it works:</strong><br/>
          <span style={{color:'#f97316'}}>Step 1</span> — Upload your CSV<br/>
          <span style={{color:'#f97316'}}>Step 2</span> — Review contacts matched to your CRM restaurants<br/>
          <span style={{color:'#f97316'}}>Step 3</span> — Review hospitality industry contacts<br/>
          <span style={{color:'#f97316'}}>Step 4</span> — Review investor contacts (VC, angels, funds)<br/>
          <span style={{color:'#f97316'}}>Step 5</span> — Review partner contacts (tech, booking, distribution)<br/>
          <span style={{color:'#f97316'}}>Step 6</span> — Confirm and import approved contacts
        </div>
      </div>
      <div style={{...S.dropZone,flexDirection:'column',gap:12,borderColor:dragActive?'#f97316':'#3f3f46',background:dragActive?'rgba(249,115,22,0.05)':'#18181b'}}
        onDragOver={e=>{e.preventDefault();setDragActive(true)}}
        onDragLeave={()=>setDragActive(false)}
        onDrop={handleDrop}
        onClick={()=>fileRef.current?.click()}>
        <I name="upload" size={40} color="#3f3f46"/>
        <div style={{fontSize:14,color:'#a1a1aa'}}>Drop Connections.csv here or click to browse</div>
        <div style={{fontSize:12,color:'#52525b'}}>LinkedIn Settings → Data Privacy → Get a copy of your data → Connections</div>
        <input ref={fileRef} type="file" accept=".csv" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
      </div>
    </div>
  );

  // ========== STEP 2: Pipeline Matches (human-in-the-loop) ==========
  if(step===2){
    const current=pipelineMatches[reviewIdx];
    return(
      <div>
        <StepBar/>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
          <div>
            <h3 style={{fontSize:16,fontWeight:600,marginBottom:4}}>Pipeline Matches</h3>
            <p style={{fontSize:13,color:'#71717a'}}>Contacts whose company matches a restaurant in your CRM. Review each one.</p>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:24,fontWeight:700,color:'#f97316'}}>{pipelineMatches.length}</div>
            <div style={{fontSize:11,color:'#71717a'}}>potential matches found</div>
          </div>
        </div>

        {/* Stats bar */}
        <div style={{...S.grid3,marginBottom:20}}>
          <div style={S.statCard}><div style={{...S.statVal,color:'#f97316',fontSize:20}}>{allParsed.length}</div><div style={S.statLabel}>Total connections parsed</div></div>
          <div style={S.statCard}><div style={{...S.statVal,color:'#10b981',fontSize:20}}>{approvedPipeline}</div><div style={S.statLabel}>Approved so far</div></div>
          <div style={S.statCard}><div style={{...S.statVal,color:'#71717a',fontSize:20}}>{Object.values(decisions).filter(d=>d==='skip').length}</div><div style={S.statLabel}>Skipped</div></div>
        </div>

        {pipelineMatches.length===0?(
          <div style={{...S.card,padding:32,textAlign:'center'}}>
            <div style={{fontSize:14,color:'#71717a',marginBottom:16}}>No connections matched to your pipeline restaurants.</div>
            <button style={{...S.btn,...S.btnPrimary}} onClick={()=>setStep(3)}>Continue to Hospitality Contacts →</button>
          </div>
        ):current?(
          <div>
            {/* Progress */}
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
              <div style={{flex:1,height:4,background:'#27272a',borderRadius:2,overflow:'hidden'}}>
                <div style={{height:'100%',background:'#f97316',borderRadius:2,width:`${((Object.keys(decisions).length)/pipelineMatches.length)*100}%`,transition:'width 0.3s'}}/>
              </div>
              <span style={{fontSize:12,color:'#71717a',whiteSpace:'nowrap'}}>{reviewIdx+1} of {pipelineMatches.length}</span>
            </div>

            {/* Review card */}
            <div style={{...S.card,padding:0,overflow:'hidden'}} className="fade-in">
              {/* Header */}
              <div style={{padding:'20px 24px',borderBottom:'1px solid #27272a',display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                <div>
                  <div style={{fontSize:18,fontWeight:600,marginBottom:4}}>{current.fullName}</div>
                  <div style={{fontSize:14,color:'#a1a1aa'}}>{current.position}{current.company?` at ${current.company}`:''}</div>
                  {current.email&&<div style={{fontSize:12,color:'#71717a',marginTop:4}}>{current.email}</div>}
                  {current.linkedinUrl&&<div style={{fontSize:12,color:'#3b82f6',marginTop:2}}>{current.linkedinUrl}</div>}
                </div>
                <StrengthBadge strength={current.bestMatch.strength}/>
              </div>

              {/* Match reasoning */}
              <div style={{padding:'16px 24px',background:'rgba(249,115,22,0.03)',borderBottom:'1px solid #27272a'}}>
                <div style={{fontSize:12,fontWeight:600,color:'#f97316',marginBottom:10,textTransform:'uppercase',letterSpacing:1}}>Match Reasoning</div>
                {current.matches.map((m,mi)=>(
                  <div key={mi} style={{marginBottom:mi<current.matches.length-1?8:0}}>
                    <div style={{fontSize:13,fontWeight:500,color:'#f5f5f5',marginBottom:2}}>→ {m.restaurant.name}{m.restaurant.group_name?` (${m.restaurant.group_name})`:''} — <span style={{color:m.strength==='high'?'#10b981':'#f59e0b'}}>{STAGE_MAP[m.restaurant.stage]?.name||m.restaurant.stage}</span></div>
                    {m.reasons.map((r,ri)=>(
                      <div key={ri} style={{fontSize:12,color:'#a1a1aa',paddingLeft:16,marginTop:2}}>• {r.text}</div>
                    ))}
                  </div>
                ))}
              </div>

              {/* Suggested outreach */}
              <div style={{padding:'16px 24px',borderBottom:'1px solid #27272a'}}>
                <div style={{fontSize:12,fontWeight:600,color:'#3b82f6',marginBottom:8,textTransform:'uppercase',letterSpacing:1}}>Suggested Outreach</div>
                <textarea style={{...S.formInput,minHeight:80,fontSize:13,lineHeight:1.6}} value={blurbs[reviewIdx]||''} onChange={e=>setBlurbs(b=>({...b,[reviewIdx]:e.target.value}))}/>
              </div>

              {/* Action buttons */}
              <div style={{padding:'16px 24px',display:'flex',gap:12,justifyContent:'space-between',alignItems:'center'}}>
                <button style={{...S.btn,...S.btnGhost}} disabled={reviewIdx===0} onClick={()=>setReviewIdx(reviewIdx-1)}>← Previous</button>
                <div style={{display:'flex',gap:12}}>
                  <button style={{...S.btn,background:'rgba(239,68,68,0.1)',color:'#ef4444',border:'1px solid rgba(239,68,68,0.2)'}} onClick={()=>decideMatch(reviewIdx,'skip')}>
                    <I name="x" size={16}/> Skip
                  </button>
                  <button style={{...S.btn,...S.btnPrimary}} onClick={()=>decideMatch(reviewIdx,'approve')}>
                    <I name="check" size={16}/> Approve & Add
                  </button>
                </div>
              </div>

              {/* Decision indicator */}
              {decisions[reviewIdx]&&(
                <div style={{padding:'8px 24px',background:decisions[reviewIdx]==='approve'?'rgba(16,185,129,0.08)':'rgba(239,68,68,0.08)',borderTop:'1px solid #27272a',fontSize:12,color:decisions[reviewIdx]==='approve'?'#10b981':'#ef4444',textAlign:'center'}}>
                  {decisions[reviewIdx]==='approve'?'✓ Approved for import':'✗ Skipped'}
                </div>
              )}
            </div>

            {/* Navigation dots */}
            <div style={{display:'flex',gap:4,justifyContent:'center',marginTop:16,flexWrap:'wrap'}}>
              {pipelineMatches.map((_,i)=>(
                <div key={i} onClick={()=>setReviewIdx(i)} style={{width:10,height:10,borderRadius:5,cursor:'pointer',background:decisions[i]==='approve'?'#10b981':decisions[i]==='skip'?'#ef4444':i===reviewIdx?'#f97316':'#3f3f46',transition:'background 0.2s'}}/>
              ))}
            </div>

            {/* Continue button */}
            {Object.keys(decisions).length===pipelineMatches.length&&(
              <div style={{textAlign:'center',marginTop:20}}>
                <button style={{...S.btn,...S.btnPrimary,padding:'12px 32px'}} onClick={()=>{setStep(3);setHospReviewIdx(0)}}>
                  Continue to Hospitality Contacts ({hospContacts.length}) →
                </button>
              </div>
            )}
          </div>
        ):null}
      </div>
    );
  }

  // ========== STEP 3: Hospitality Contacts ==========
  if(step===3){
    const current=hospContacts[hospReviewIdx];
    return(
      <div>
        <StepBar/>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
          <div>
            <h3 style={{fontSize:16,fontWeight:600,marginBottom:4}}>Hospitality Contacts</h3>
            <p style={{fontSize:13,color:'#71717a'}}>These connections work in hospitality but aren't linked to a specific restaurant in your pipeline.</p>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:24,fontWeight:700,color:'#8b5cf6'}}>{hospContacts.length}</div>
            <div style={{fontSize:11,color:'#71717a'}}>hospitality contacts found</div>
          </div>
        </div>

        <div style={{...S.grid3,marginBottom:20}}>
          <div style={S.statCard}><div style={{...S.statVal,color:'#10b981',fontSize:20}}>{approvedHosp}</div><div style={S.statLabel}>Approved</div></div>
          <div style={S.statCard}><div style={{...S.statVal,color:'#71717a',fontSize:20}}>{Object.values(hospDecisions).filter(d=>d==='skip').length}</div><div style={S.statLabel}>Skipped</div></div>
          <div style={S.statCard}><div style={{...S.statVal,color:'#f97316',fontSize:20}}>{totalApproved}</div><div style={S.statLabel}>Total approved</div></div>
        </div>

        {hospContacts.length===0?(
          <div style={{...S.card,padding:32,textAlign:'center'}}>
            <div style={{fontSize:14,color:'#71717a',marginBottom:16}}>No additional hospitality contacts found.</div>
            <button style={{...S.btn,...S.btnPrimary}} onClick={()=>setStep(4)}>Continue to Import Summary →</button>
          </div>
        ):current?(
          <div>
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
              <div style={{flex:1,height:4,background:'#27272a',borderRadius:2,overflow:'hidden'}}>
                <div style={{height:'100%',background:'#8b5cf6',borderRadius:2,width:`${((Object.keys(hospDecisions).length)/hospContacts.length)*100}%`,transition:'width 0.3s'}}/>
              </div>
              <span style={{fontSize:12,color:'#71717a',whiteSpace:'nowrap'}}>{hospReviewIdx+1} of {hospContacts.length}</span>
            </div>

            <div style={{...S.card,padding:0,overflow:'hidden'}} className="fade-in">
              <div style={{padding:'20px 24px',borderBottom:'1px solid #27272a',display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                <div>

// ==================== TARGETS & LEADERBOARD ====================
const TargetsPage=()=>{
  const{data,currentUser,updateUser}=useApp();
  const{restaurants,activities,users}=data;
  const[tab,setTab]=useState('progress');
  const[period,setPeriod]=useState('mtd');
  const[editTargets,setEditTargets]=useState(false);
  const[targets,setTargets]=useState({monthly_target_deals:currentUser?.monthly_target_deals||5,monthly_target_mrr:currentUser?.monthly_target_mrr||2500,weekly_target_conversations:currentUser?.weekly_target_conversations||15,weekly_target_proposals:currentUser?.weekly_target_proposals||5,monthly_target_trials:currentUser?.monthly_target_trials||8});

  const som=startOfMonth();const sow=startOfWeek();const soq=startOfQuarter();const soy=startOfYear();

  const getStats=(userId,from)=>{
    const myRests=restaurants.filter(r=>r.owner_id===userId);
    const myActs=activities.filter(a=>a.user_id===userId);
    return{
      deals:myRests.filter(r=>r.stage==='live'&&new Date(r.stage_entered_at)>=from).length,
      mrr:myRests.filter(r=>r.stage==='live'&&new Date(r.stage_entered_at)>=from).reduce((s,r)=>s+(parseFloat(r.target_mrr)||0),0),
      conversations:myActs.filter(a=>['call','meeting'].includes(a.type)&&new Date(a.occurred_at)>=from).length,
      proposals:myRests.filter(r=>['proposal','trial','live'].includes(r.stage)&&new Date(r.stage_entered_at)>=from).length,
      trials:myRests.filter(r=>r.stage==='trial'&&new Date(r.stage_entered_at)>=from).length,
      pipeline:myRests.filter(r=>!['live','closed'].includes(r.stage)).length,
      totalActivities:myActs.filter(a=>new Date(a.occurred_at)>=from).length
    };
  };

  const myStats=currentUser?getStats(currentUser.id,som):null;
  const myWeekStats=currentUser?getStats(currentUser.id,sow):null;

  // Leaderboard
  const periodStart=period==='mtd'?som:period==='qtd'?soq:soy;
  const leaderboard=users.map(u=>{
    const s=getStats(u.id,periodStart);
    return{...u,stats:s,score:s.deals*100+s.mrr};
  }).sort((a,b)=>b.score-a.score);

  const handleSaveTargets=()=>{
    updateUser(currentUser.id,targets);
    setEditTargets(false);

    <div>
      <div style={{display:'flex',gap:8,marginBottom:24}}>

        <button style={{...S.btn,color:tab==='leaderboard'?'#f97316':'#a1a1aa',background:tab==='leaderboard'?'rgba(249,115,22,0.15)':'transparent'}} onClick={()=>setTab('leaderboard')}>Leaderboard</button>

      {tab==='progress'&&currentUser&&(
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
            <h3 style={{fontSize:16,fontWeight:600}}>Monthly & Weekly Targets</h3>
            <button style={{...S.btn,...S.btnSecondary,...S.btnSm}} onClick={()=>setEditTargets(!editTargets)}><I name="edit" size={14}/> Edit Targets</button>
          </div>

          {editTargets&&(
            <div style={{...S.card,padding:20,marginBottom:24}}>
              <div style={S.formGrid}>
                {[{key:'monthly_target_deals',label:'Monthly Deals Target'},{key:'monthly_target_mrr',label:'Monthly MRR Target (£)'},{key:'weekly_target_conversations',label:'Weekly Conversations'},{key:'weekly_target_proposals',label:'Weekly Proposals'},{key:'monthly_target_trials',label:'Monthly Trials'}].map(t=>(
                  <div key={t.key} style={S.formGroup}>
                    <label style={S.formLabel}>{t.label}</label>
                    <input style={S.formInput} type="number" value={targets[t.key]} onChange={e=>setTargets(ts=>({...ts,[t.key]:parseInt(e.target.value)||0}))}/>

              </div>
              <button style={{...S.btn,...S.btnPrimary,marginTop:16}} onClick={handleSaveTargets}>Save Targets</button>
            </div>
          )}

          <div style={S.grid2}>
            {/* Monthly targets */}
            <div style={S.card}>
              <div style={S.cardHead}><span style={S.cardTitle}>Monthly Progress</span><span style={{fontSize:12,color:'#71717a'}}>{daysLeftInMonth()} days left</span></div>
              <div style={{padding:16}}>
                {[
                  {label:'Deals Closed',val:myStats.deals,target:currentUser.monthly_target_deals,color:'#10b981',icon:'check'},
                  {label:'MRR from New Deals',val:myStats.mrr,target:currentUser.monthly_target_mrr,color:'#3b82f6',fmt:true},
                  {label:'Trials Started',val:myStats.trials,target:currentUser.monthly_target_trials,color:'#14b8a6'},
                ].map(m=>(
                  <div key={m.label} style={{marginBottom:18}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                      <span style={{fontSize:13,color:'#a1a1aa'}}>{m.label}</span>
                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <span style={{fontSize:14,fontWeight:600,color:m.color}}>{m.fmt?fmtCurrency(m.val):m.val} / {m.fmt?fmtCurrency(m.target):m.target}</span>
                        <PaceIndicator value={m.val} target={m.target} daysElapsed={dayOfMonth()} totalDays={daysInMonth()}/>
                      </div>
                    </div>
                    <ProgressBar value={m.val} max={m.target} color={m.color} height={10}/>
                  </div>
                ))}
              </div>
            </div>

            {/* Weekly targets */}
            <div style={S.card}>
              <div style={S.cardHead}><span style={S.cardTitle}>Weekly Progress</span><span style={{fontSize:12,color:'#71717a'}}>{daysLeftInWeek()} days left</span></div>
              <div style={{padding:16}}>
                {[
                  {label:'Conversations (Calls + Meetings)',val:myWeekStats.conversations,target:currentUser.weekly_target_conversations,color:'#8b5cf6'},
                  {label:'Proposals Sent',val:myWeekStats.proposals,target:currentUser.weekly_target_proposals,color:'#f59e0b'},
                ].map(m=>(
                  <div key={m.label} style={{marginBottom:18}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                      <span style={{fontSize:13,color:'#a1a1aa'}}>{m.label}</span>
                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <span style={{fontSize:14,fontWeight:600,color:m.color}}>{m.val} / {m.target}</span>
                        <PaceIndicator value={m.val} target={m.target} daysElapsed={new Date().getDay()||7} totalDays={5}/>
                      </div>
                    </div>
                    <ProgressBar value={m.val} max={m.target} color={m.color} height={10}/>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}

      {tab==='leaderboard'&&(
        <div>
          <div style={{display:'flex',gap:8,marginBottom:20}}>
            {[{id:'mtd',label:'This Month'},{id:'qtd',label:'This Quarter'},{id:'ytd',label:'This Year'}].map(p=>(
              <button key={p.id} style={{...S.btn,...S.btnSm,color:period===p.id?'#f97316':'#a1a1aa',background:period===p.id?'rgba(249,115,22,0.15)':'#27272a'}} onClick={()=>setPeriod(p.id)}>{p.label}</button>
            ))}
          </div>

          <div style={S.card}>
            <table style={S.table}>
              <thead><tr>
                <th style={{...S.th,width:50}}>#</th>
                <th style={S.th}>Team Member</th>
                <th style={S.th}>Deals</th>
                <th style={S.th}>MRR</th>
                <th style={S.th}>Activities</th>
                <th style={S.th}>Pipeline</th>
                <th style={S.th}>Badges</th>
              </tr></thead>
              <tbody>
                {leaderboard.map((u,i)=>{
                  const badges=[];
                  if(u.stats.deals>=1)badges.push({label:'First Deal',color:'#f59e0b',icon:'star'});
                  if(u.stats.deals>=5)badges.push({label:'5 Deals',color:'#10b981',icon:'award'});
                  if(u.stats.deals>=10)badges.push({label:'10 Deals',color:'#8b5cf6',icon:'award'});
                  return(
                    <tr key={u.id} style={{background:i===0?'rgba(249,115,22,0.05)':''}}>
                      <td style={{...S.td,fontWeight:700,color:i===0?'#f97316':i===1?'#a1a1aa':i===2?'#a06533':'#71717a',fontSize:18}}>{i+1}</td>
                      <td style={S.td}><div style={{display:'flex',alignItems:'center',gap:10}}><Avatar name={u.full_name} size={32}/><div><div style={{fontWeight:500}}>{u.full_name}</div><div style={{fontSize:12,color:'#71717a'}}>{u.role}</div></div></div></td>
                      <td style={{...S.td,fontWeight:600,color:'#10b981'}}>{u.stats.deals}</td>
                      <td style={{...S.td,fontWeight:600,color:'#3b82f6'}}>{fmtCurrency(u.stats.mrr)}</td>
                      <td style={{...S.td,color:'#a1a1aa'}}>{u.stats.totalActivities}</td>
                      <td style={{...S.td,color:'#a1a1aa'}}>{u.stats.pipeline}</td>
                      <td style={S.td}><div style={{display:'flex',gap:4}}>{badges.map(b=><span key={b.label} style={{...S.badge,background:`${b.color}22`,color:b.color,fontSize:10}}><I name={b.icon} size={10}/>{b.label}</span>)}</div></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
};
