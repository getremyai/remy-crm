const ActivitiesPage=()=>{
  const{data,currentUser,addActivity}=useApp();
  const{activities,restaurants,users}=data;
  const[typeFilter,setTypeFilter]=useState('');
  const[userFilter,setUserFilter]=useState('');
  const[restFilter,setRestFilter]=useState('');
  const[showAdd,setShowAdd]=useState(false);
  const[newAct,setNewAct]=useState({restaurant_id:'',contact_id:'',type:'call',subject:'',body:''});

  const filtered=useMemo(()=>{
    let list=[...activities];
    if(typeFilter)list=list.filter(a=>a.type===typeFilter);
    if(userFilter)list=list.filter(a=>a.user_id===userFilter);
    if(restFilter)list=list.filter(a=>a.restaurant_id===restFilter);
    return list.sort((a,b)=>new Date(b.occurred_at)-new Date(a.occurred_at));
  },[activities,typeFilter,userFilter,restFilter]);

  const handleAddActivity=()=>{
    if(!newAct.subject.trim())return;
    addActivity(newAct);
    setNewAct({restaurant_id:'',contact_id:'',type:'call',subject:'',body:''});
    setShowAdd(false);
  };

  const typeColors={call:'#3b82f6',email:'#8b5cf6',meeting:'#f59e0b',note:'#71717a',stage_change:'#10b981',contact_linked:'#14b8a6',import:'#6b7280'};
  const typeLabels={call:'Call',email:'Email',meeting:'Meeting',note:'Note',stage_change:'Stage Change',contact_linked:'Contact Linked',import:'Import'};

  return(
    <div>
      <div style={{display:'flex',gap:12,marginBottom:20,alignItems:'center',flexWrap:'wrap'}}>
        <select style={{...S.formInput,width:150,padding:'8px 12px'}} value={typeFilter} onChange={e=>setTypeFilter(e.target.value)}>
          <option value="">All types</option>
          {ACTIVITY_TYPES.map(t=><option key={t} value={t}>{typeLabels[t]||t}</option>)}
        </select>
        <select style={{...S.formInput,width:160,padding:'8px 12px'}} value={userFilter} onChange={e=>setUserFilter(e.target.value)}>
          <option value="">All team members</option>
          {users.map(u=><option key={u.id} value={u.id}>{u.full_name}</option>)}
        </select>
        <select style={{...S.formInput,width:180,padding:'8px 12px'}} value={restFilter} onChange={e=>setRestFilter(e.target.value)}>
          <option value="">All restaurants</option>
          {[...restaurants].sort((a,b)=>a.name.localeCompare(b.name)).map(r=><option key={r.id} value={r.id}>{r.name}</option>)}
        </select>
        <div style={{flex:1}}/>
        <span style={{fontSize:13,color:'#71717a'}}>{filtered.length} activities</span>
        <button style={{...S.btn,...S.btnPrimary}} onClick={()=>setShowAdd(true)}><I name="plus" size={16}/> Log Activity</button>
      </div>

      <div style={S.card}>
        <div style={{padding:16}}>
          {filtered.length===0?<EmptyState icon="activity" message="No activities found"/>:
            filtered.slice(0,50).map((a,i)=>{
              const rest=restaurants.find(r=>r.id===a.restaurant_id);
              const user=users.find(u=>u.id===a.user_id);
              const contact=a.contact_id?data.contacts.find(c=>c.id===a.contact_id):null;
              return(
                <div key={a.id} style={{position:'relative',paddingLeft:28,paddingBottom:20,borderLeft:i<filtered.length-1?'2px solid #27272a':'none',marginLeft:5}}>
                  <div style={{position:'absolute',left:-5,top:2,width:12,height:12,borderRadius:'50%',background:typeColors[a.type]||'#71717a',border:'2px solid #09090b'}}/>
                  <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between'}}>
                    <div>
                      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                        <span style={{...S.badge,background:`${typeColors[a.type]||'#71717a'}22`,color:typeColors[a.type]||'#71717a',fontSize:10}}>{typeLabels[a.type]||a.type}</span>
                        <span style={{fontWeight:500,fontSize:14}}>{a.subject}</span>
                      </div>
                      {a.body&&<div style={{fontSize:13,color:'#a1a1aa',marginBottom:4,maxWidth:600}}>{a.body}</div>}
                      <div style={{display:'flex',gap:12,fontSize:12,color:'#71717a'}}>
                        {rest&&<span>{rest.name}</span>}
                        {contact&&<span>· {contact.full_name}</span>}
                        {user&&<span>· {user.full_name}</span>}
                      </div>
                    </div>
                    <span style={{fontSize:12,color:'#52525b',whiteSpace:'nowrap'}}>{fmtDate(a.occurred_at)}</span>
                  </div>
                </div>
              );
            })
          }
        </div>
      </div>

      {showAdd&&(
        <Modal title="Log Activity" onClose={()=>setShowAdd(false)} footer={<>
          <button style={{...S.btn,...S.btnSecondary}} onClick={()=>setShowAdd(false)}>Cancel</button>
          <button style={{...S.btn,...S.btnPrimary}} onClick={handleAddActivity}>Log Activity</button>
        </>}>
          <div style={S.formGrid}>
            <div style={S.formGroup}><label style={S.formLabel}>Type</label>
              <SelectInput value={newAct.type} onChange={v=>setNewAct(a=>({...a,type:v}))} options={[{value:'call',label:'Call'},{value:'email',label:'Email'},{value:'meeting',label:'Meeting'},{value:'note',label:'Note'}]}/>
            </div>
            <div style={S.formGroup}><label style={S.formLabel}>Restaurant</label>
              <select style={S.formInput} value={newAct.restaurant_id} onChange={e=>setNewAct(a=>({...a,restaurant_id:e.target.value}))}>
                <option value="">Select (optional)...</option>
                {[...restaurants].sort((a,b)=>a.name.localeCompare(b.name)).map(r=><option key={r.id} value={r.id}>{r.name}</option>)}
              </select>
            </div>
          </div>
          <div style={{...S.formGroup,marginTop:16}}><label style={S.formLabel}>Subject *</label><input style={S.formInput} value={newAct.subject} onChange={e=>setNewAct(a=>({...a,subject:e.target.value}))} placeholder="What happened?"/></div>
          <div style={{...S.formGroup,marginTop:16}}><label style={S.formLabel}>Details</label><textarea style={S.formTextarea} value={newAct.body} onChange={e=>setNewAct(a=>({...a,body:e.target.value}))} placeholder="Add details..." rows={3}/></div>
        </Modal>
      )}
    </div>
  );
};

const AdminPage=()=>{
  const{data,currentUser,updateUser,removeUser,resetData,showToast}=useApp();
  const{users,restaurants,contacts,activities,funding_deals,partnerships}=data;
  const[tab,setTab]=useState('users');
  const[removeTarget,setRemoveTarget]=useState(null); // user to remove
  const[reassignTo,setReassignTo]=useState(''); // who gets their data

  const exportCSV=(type)=>{
    let csv='';let filename='';
    if(type==='restaurants'){
      csv='Name,Group,Stage,Owner,Target MRR,Booking System,Postcode,Covers,Next Action Date,Next Action Type,Close Reason,Notes\n';
      restaurants.forEach(r=>{
        const owner=users.find(u=>u.id===r.owner_id)?.full_name||'';
        csv+=`"${r.name}","${r.group_name||''}","${r.stage}","${owner}","${r.target_mrr||''}","${r.booking_system||''}","${r.postcode||''}","${r.tables||''}","${r.next_action_date||''}","${r.next_action_type||''}","${r.close_reason||''}","${(r.notes||'').replace(/"/g,'""')}"\n`;
      });
      filename='remy_restaurants.csv';
    }else if(type==='contacts'){
      csv='Name,Email,Phone,Mobile,Job Title,Company,Tags,Source,Notes\n';
      contacts.forEach(c=>{
        csv+=`"${c.full_name}","${c.email||''}","${c.phone||''}","${c.mobile||''}","${c.job_title||''}","${c.company||''}","${(c.global_tags||[]).join('; ')}","${c.source||''}","${(c.notes||'').replace(/"/g,'""')}"\n`;
      });
      filename='remy_contacts.csv';
    }else if(type==='activities'){
      csv='Date,Type,Subject,Details,Restaurant,User\n';
      activities.forEach(a=>{
        const rest=restaurants.find(r=>r.id===a.restaurant_id)?.name||'';
        const user=users.find(u=>u.id===a.user_id)?.full_name||'';
        csv+=`"${fmtDate(a.occurred_at)}","${a.type}","${a.subject||''}","${(a.body||'').replace(/"/g,'""')}","${rest}","${user}"\n`;
      });
      filename='remy_activities.csv';
    }
    const blob=new Blob([csv],{type:'text/csv'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=filename;a.click();
    URL.revokeObjectURL(url);
    showToast(`Exported ${filename}`);
  };

  const generateInvestorSnapshot=()=>{
    const now=new Date();
    const monthName=now.toLocaleString('default',{month:'long',year:'numeric'});
    const som=startOfMonth();
    const live=restaurants.filter(r=>r.stage==='live');
    const pipeline=restaurants.filter(r=>!['live','closed','identified'].includes(r.stage));
    const trials=restaurants.filter(r=>r.stage==='trial');
    const proposals=restaurants.filter(r=>r.stage==='proposal');
    const totalMRR=live.reduce((s,r)=>s+(parseFloat(r.target_mrr)||0),0);
    const pipelineMRR=pipeline.reduce((s,r)=>s+(parseFloat(r.target_mrr)||0),0);
    const newLiveThisMonth=live.filter(r=>new Date(r.stage_entered_at)>=som);
    const newTrialsThisMonth=trials.filter(r=>new Date(r.stage_entered_at)>=som);
    const actsThisMonth=activities.filter(a=>new Date(a.occurred_at)>=som);
    const calls=actsThisMonth.filter(a=>a.type==='call').length;
    const meetings=actsThisMonth.filter(a=>a.type==='meeting').length;
    const emails=actsThisMonth.filter(a=>a.type==='email').length;
    const closedLost=restaurants.filter(r=>r.stage==='closed');
    const winRate=live.length>0?Math.round((live.length/(live.length+closedLost.length))*100):0;

    const stageBreakdown=STAGES.map(s=>{
      const count=restaurants.filter(r=>r.stage===s.id).length;
      return count>0?`  ${s.name}: ${count}`:null;
    }).filter(Boolean).join('\n');

    const topTrials=trials.slice(0,5).map(r=>`  - ${r.name}${r.target_mrr?' ('+fmtCurrency(r.target_mrr)+'/mo)':''}${r.trial_start_date?' — started '+fmtDate(r.trial_start_date):''}`).join('\n');
    const topProposals=proposals.slice(0,5).map(r=>`  - ${r.name}${r.target_mrr?' ('+fmtCurrency(r.target_mrr)+'/mo)':''}`).join('\n');

    const report=`REMY AI — INVESTOR UPDATE
${monthName}
${'='.repeat(50)}

KEY METRICS
  Live Customers:         ${live.length}
  Monthly Recurring Rev:  ${fmtCurrency(totalMRR)}/mo
  Active Trials:          ${trials.length}
  Active Proposals:       ${proposals.length}
  Pipeline Value:         ${fmtCurrency(pipelineMRR)}/mo potential
  Win Rate:               ${winRate}%

THIS MONTH
  New Customers Won:      ${newLiveThisMonth.length}
  New Trials Started:     ${newTrialsThisMonth.length}
  Calls Made:             ${calls}
  Meetings Held:          ${meetings}
  Emails Sent:            ${emails}
  Total Touchpoints:      ${actsThisMonth.length}

PIPELINE BREAKDOWN
${stageBreakdown}

${trials.length>0?`ACTIVE TRIALS\n${topTrials}\n`:''}${proposals.length>0?`\nPENDING PROPOSALS\n${topProposals}\n`:''}
FUNDING PIPELINE
  Total Deals:            ${(funding_deals||[]).length}
  Active (non-closed):    ${(funding_deals||[]).filter(d=>d.stage!=='closed').length}
  In DD / Term Sheet:     ${(funding_deals||[]).filter(d=>['dd','term_sheet'].includes(d.stage)).length}
  Total Seeking:          ${fmtCurrency((funding_deals||[]).filter(d=>d.stage!=='closed').reduce((s,d)=>s+(parseFloat(d.amount_target)||0),0))}
  Closed:                 ${(funding_deals||[]).filter(d=>d.stage==='closed').length} (${fmtCurrency((funding_deals||[]).filter(d=>d.stage==='closed').reduce((s,d)=>s+(parseFloat(d.amount_target)||0),0))})

PARTNERSHIPS
  Total:                  ${(partnerships||[]).length}
  Live:                   ${(partnerships||[]).filter(p=>p.stage==='live').length}
  In Pipeline:            ${(partnerships||[]).filter(p=>!['live','churned'].includes(p.stage)).length}
  Churned:                ${(partnerships||[]).filter(p=>p.stage==='churned').length}

TEAM
  Active Reps: ${users.length}
${users.map(u=>{
  const myRests=restaurants.filter(r=>r.owner_id===u.id);
  const myLive=myRests.filter(r=>r.stage==='live').length;
  const myPipeline=myRests.filter(r=>!['live','closed','identified'].includes(r.stage)).length;
  return`  ${u.full_name} (${u.role}) — ${myLive} live, ${myPipeline} in pipeline`;
}).join('\n')}

${'='.repeat(50)}
Generated: ${now.toLocaleDateString('en-GB')} ${now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
Remy AI CRM v2
`;

    const blob=new Blob([report],{type:'text/plain'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`remy_investor_update_${now.toISOString().slice(0,10)}.txt`;a.click();
    URL.revokeObjectURL(url);
    showToast('Investor snapshot exported');
  };

  const generateRestaurantUpdate=(rest)=>{
    const r=rest;
    const stage=STAGES.find(s=>s.id===r.stage);
    const owner=users.find(u=>u.id===r.owner_id)?.full_name||'Unassigned';
    const rActs=activities.filter(a=>a.restaurant_id===r.id).slice(0,10);
    const rContacts=data.contact_restaurants.filter(cr=>cr.restaurant_id===r.id).map(cr=>{
      const c=contacts.find(c=>c.id===cr.contact_id);
      return c?`${c.full_name}${c.job_title?' ('+c.job_title+')':''}${c.email?' — '+c.email:''}`:null;
    }).filter(Boolean);

    return`${r.name}${r.group_name?' ('+r.group_name+')':''}
Stage: ${stage?.name||r.stage} | Owner: ${owner} | MRR Target: ${fmtCurrency(r.target_mrr||0)}/mo
${r.booking_system?'Booking: '+r.booking_system:''}${r.tables?' | Covers: '+r.tables:''}
${r.next_action_date?'Next: '+r.next_action_type+' on '+fmtDate(r.next_action_date):''}
${rContacts.length>0?'\nContacts:\n'+rContacts.map(c=>'  '+c).join('\n'):''}
${rActs.length>0?'\nRecent Activity:\n'+rActs.map(a=>'  ['+fmtDate(a.occurred_at)+'] '+a.subject+(a.body?' — '+a.body.slice(0,100):'')).join('\n'):''}`;
  };

  const exportPipelineReport=()=>{
    const now=new Date();
    const active=restaurants.filter(r=>!['closed'].includes(r.stage)).sort((a,b)=>STAGES.findIndex(s=>s.id===b.stage)-STAGES.findIndex(s=>s.id===a.stage));
    const report=`REMY AI — PIPELINE REPORT\n${now.toLocaleDateString('en-GB')}\n${'='.repeat(50)}\n\n`+active.map(r=>generateRestaurantUpdate(r)).join('\n\n'+'-'.repeat(40)+'\n\n');

const FundingDealModal = ({ deal, isOpen, onClose }) => {
  const { data, addFundingDeal, updateFundingDeal, currentUser, showToast } = useApp();
  const [form, setForm] = useState(deal || {});
  const [errors, setErrors] = useState({});

  useEffect(() => {
    setForm(deal || {});
    setErrors({});
  }, [deal, isOpen]);

  const handleChange = (field, value) => {
    setForm(prev => ({ ...prev, [field]: value }));
    if (errors[field]) {
      setErrors(prev => ({ ...prev, [field]: null }));
    }
  };

  const validate = () => {
    const newErrors = {};
    if (!form.investor_name?.trim()) newErrors.investor_name = 'Investor name required';
    if (!form.round_type) newErrors.round_type = 'Round type required';
    if (!form.stage) newErrors.stage = 'Stage required';
    if (form.amount_target && isNaN(form.amount_target)) newErrors.amount_target = 'Must be a number';
    if (form.valuation_offered && isNaN(form.valuation_offered)) newErrors.valuation_offered = 'Must be a number';
    setErrors(newErrors);
    return Object.keys(newErrors).length === 0;
  };

  const handleSave = async () => {
    if (!validate()) return;

    const payload = {
      investor_name: form.investor_name,
      fund_name: form.fund_name || '',
      contact_id: form.contact_id || null,
      round_type: form.round_type,
      amount_target: form.amount_target ? parseFloat(form.amount_target) : 0,
      valuation_offered: form.valuation_offered ? parseFloat(form.valuation_offered) : 0,
      stage: form.stage,
      intro_source: form.intro_source || '',
      next_action_date: form.next_action_date || null,
      next_action_type: form.next_action_type || 'Follow-up',
      notes: form.notes || '',
      owner_id: form.owner_id || currentUser.id
    };

    if (form.id) {
      updateFundingDeal(form.id, payload);
      showToast('Funding deal updated', 'success');
    } else {
      addFundingDeal(payload);
      showToast('Funding deal added', 'success');
    }
    onClose();
  };

  const contactName = form.contact_id
    ? data.contacts.find(c => c.id === form.contact_id)?.name || ''
    : '';

  return (
    <Modal isOpen={isOpen} onClose={onClose} size="lg">
      <div style={S.modalContent}>
        <div style={S.modalHeader}>
          <h2 style={S.cardTitle}>{form.id ? 'Edit Funding Deal' : 'New Funding Deal'}</h2>
          <button onClick={onClose} style={{...S.btn, background: 'transparent', padding: '4px'}}>
            <I name="x" size={20} color="#a1a1aa" />
          </button>
        </div>

        <div style={{padding: '24px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '20px', maxHeight: '70vh', overflowY: 'auto'}}>

          <div style={S.formGroup}>
            <label style={S.formLabel}>Investor Name *</label>
            <input
              style={{...S.formInput, borderColor: errors.investor_name ? '#ef4444' : undefined}}
              type="text"
              value={form.investor_name || ''}
              onChange={(e) => handleChange('investor_name', e.target.value)}
              placeholder="e.g., Accel Partners"
            />
            {errors.investor_name && <div style={{color: '#ef4444', fontSize: '12px', marginTop: '4px'}}>{errors.investor_name}</div>}
          </div>

          <div style={S.formGroup}>
            <label style={S.formLabel}>Fund Name</label>
            <input
              style={S.formInput}
              type="text"
              value={form.fund_name || ''}
              onChange={(e) => handleChange('fund_name', e.target.value)}
              placeholder="e.g., Accel Ventures IV"
            />
          </div>

          <div style={S.formGroup}>
            <label style={S.formLabel}>Contact</label>
            <SelectInput
              options={data.contacts.map(c => ({value: c.id, label: c.name}))}
              value={form.contact_id}
              onChange={(val) => handleChange('contact_id', val)}
              placeholder="Select contact"
            />
          </div>

          <div style={S.formGroup}>
            <label style={S.formLabel}>Round Type *</label>
            <SelectInput
              options={ROUND_TYPES.map(rt => ({value: rt, label: rt}))}
              value={form.round_type}
              onChange={(val) => handleChange('round_type', val)}
              placeholder="Select round type"
            />
            {errors.round_type && <div style={{color: '#ef4444', fontSize: '12px', marginTop: '4px'}}>{errors.round_type}</div>}
          </div>

          <div style={S.formGroup}>
            <label style={S.formLabel}>Amount Target (£)</label>
            <input
              style={{...S.formInput, borderColor: errors.amount_target ? '#ef4444' : undefined}}
              type="number"
              value={form.amount_target || ''}
              onChange={(e) => handleChange('amount_target', e.target.value)}
              placeholder="0"
            />
            {errors.amount_target && <div style={{color: '#ef4444', fontSize: '12px', marginTop: '4px'}}>{errors.amount_target}</div>}
          </div>

          <div style={S.formGroup}>
            <label style={S.formLabel}>Valuation Offered (£)</label>
            <input
              style={{...S.formInput, borderColor: errors.valuation_offered ? '#ef4444' : undefined}}
              type="number"
              value={form.valuation_offered || ''}
              onChange={(e) => handleChange('valuation_offered', e.target.value)}
              placeholder="0"
            />
            {errors.valuation_offered && <div style={{color: '#ef4444', fontSize: '12px', marginTop: '4px'}}>{errors.valuation_offered}</div>}
          </div>

          <div style={S.formGroup}>
            <label style={S.formLabel}>Stage *</label>
            <SelectInput
              options={FUNDING_STAGES.map(s => ({value: s.id, label: s.name}))}
              value={form.stage}
              onChange={(val) => handleChange('stage', val)}
              placeholder="Select stage"
            />
            {errors.stage && <div style={{color: '#ef4444', fontSize: '12px', marginTop: '4px'}}>{errors.stage}</div>}
          </div>

          <div style={S.formGroup}>
            <label style={S.formLabel}>Intro Source</label>
            <input
              style={S.formInput}
              type="text"
              value={form.intro_source || ''}
              onChange={(e) => handleChange('intro_source', e.target.value)}
              placeholder="Who introduced you?"
            />
          </div>

          <div style={S.formGroup}>
            <label style={S.formLabel}>Next Action Date</label>
            <input
              style={S.formInput}
              type="date"
              value={form.next_action_date || ''}
              onChange={(e) => handleChange('next_action_date', e.target.value)}
            />
          </div>

          <div style={S.formGroup}>
            <label style={S.formLabel}>Next Action Type</label>
            <SelectInput
              options={[
                {value: 'Call', label: 'Call'},
                {value: 'Email', label: 'Email'},
                {value: 'Meeting', label: 'Meeting'},
                {value: 'Follow-up', label: 'Follow-up'}
              ]}
              value={form.next_action_type || 'Follow-up'}
              onChange={(val) => handleChange('next_action_type', val)}
            />
          </div>

          <div style={S.formGroup}>
            <label style={S.formLabel}>Owner</label>
            <SelectInput
              options={data.users.map(u => ({value: u.id, label: u.name}))}
              value={form.owner_id || currentUser.id}
              onChange={(val) => handleChange('owner_id', val)}
            />
          </div>

          <div style={{...S.formGroup, gridColumn: '1 / -1'}}>
            <label style={S.formLabel}>Notes</label>
            <textarea
              style={{...S.formInput, minHeight: '100px', fontFamily: 'inherit'}}
              value={form.notes || ''}
              onChange={(e) => handleChange('notes', e.target.value)}
              placeholder="Add notes about this deal..."
            />
          </div>
        </div>

        <div style={{borderTop: '1px solid #27272a', padding: '16px 24px', display: 'flex', gap: '12px', justifyContent: 'flex-end'}}>
          <button style={S.btnSecondary} onClick={onClose}>Cancel</button>
          <button style={S.btnPrimary} onClick={handleSave}>Save Deal</button>
        </div>
      </div>
    </Modal>
  );
};

const KanbanView = ({ deals, searchQuery, onEditDeal }) => {
  const [draggedDeal, setDraggedDeal] = useState(null);
  const { updateFundingDeal } = useApp();

  const filteredDeals = useMemo(() => {
    return deals.filter(d => {
      const query = searchQuery.toLowerCase();
      return d.investor_name.toLowerCase().includes(query) ||
             (d.fund_name || '').toLowerCase().includes(query);
    });
  }, [deals, searchQuery]);

  const dealsByStage = useMemo(() => {
    const map = {};
    FUNDING_STAGES.forEach(s => { map[s.id] = []; });
    filteredDeals.forEach(d => {
      if (map[d.stage]) map[d.stage].push(d);
    });
    return map;
  }, [filteredDeals]);

  const handleDragStart = (e, deal) => {
    setDraggedDeal(deal);
    e.dataTransfer.effectAllowed = 'move';
  };

  const handleDragOver = (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  };

  const handleDrop = (e, stageId) => {
    e.preventDefault();
    if (draggedDeal && draggedDeal.stage !== stageId) {
      updateFundingDeal(draggedDeal.id, { stage: stageId });
    }
    setDraggedDeal(null);
  };

  const handleDragEnd = () => {
    setDraggedDeal(null);
  };

  return (
    <div style={{display: 'grid', gridTemplateColumns: `repeat(${FUNDING_STAGES.length}, 1fr)`, gap: '16px', overflowX: 'auto', paddingBottom: '20px'}}>
      {FUNDING_STAGES.map(stage => (
        <div key={stage.id}>
          <div style={{
            background: stage.color,
            color: '#fff',
            padding: '8px 12px',
            borderRadius: '6px',
            fontSize: '13px',
            fontWeight: '600',
            marginBottom: '12px'
          }}>
            {stage.name} ({dealsByStage[stage.id].length})
          </div>

          <div
            style={{
              minHeight: '400px',
              background: '#18181b',
              border: '1px solid #27272a',
              borderRadius: '8px',
              padding: '12px',
              gap: '12px',
              display: 'flex',
              flexDirection: 'column'
            }}
            onDragOver={handleDragOver}
            onDrop={(e) => handleDrop(e, stage.id)}
          >
            {dealsByStage[stage.id].map(deal => (
              <div
                key={deal.id}
                draggable
                onDragStart={(e) => handleDragStart(e, deal)}
                onDragEnd={handleDragEnd}
                onClick={() => onEditDeal(deal)}
                style={{
                  background: '#27272a',
                  border: `2px solid ${stage.color}`,
                  borderRadius: '6px',
                  padding: '12px',
                  cursor: 'grab',
                  opacity: draggedDeal?.id === deal.id ? 0.6 : 1,
                  transition: 'all 0.2s',
                  userSelect: 'none'
                }}
              >
                <div style={{fontSize: '13px', fontWeight: '600', color: '#fafafa', marginBottom: '4px'}}>
                  {deal.investor_name}
                </div>
                {deal.fund_name && (
                  <div style={{fontSize: '12px', color: '#a1a1aa', marginBottom: '8px'}}>
                    {deal.fund_name}
                  </div>
                )}
                <div style={{fontSize: '12px', color: '#f97316', fontWeight: '600'}}>
                  {deal.amount_target ? fmtCurrency(deal.amount_target) : 'TBD'}
                </div>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
};

const ListView = ({ deals, searchQuery, onEditDeal }) => {
  const { data } = useApp();
  const [sortCol, setSortCol] = useState('investor_name');
  const [sortAsc, setSortAsc] = useState(true);

  const filteredDeals = useMemo(() => {
    let filtered = deals.filter(d => {
      const query = searchQuery.toLowerCase();
      return d.investor_name.toLowerCase().includes(query) ||
             (d.fund_name || '').toLowerCase().includes(query);
    });

    return filtered.sort((a, b) => {
      let aVal = a[sortCol];
      let bVal = b[sortCol];
      if (sortCol === 'owner_id') {
        aVal = data.users.find(u => u.id === a.owner_id)?.name || '';
        bVal = data.users.find(u => u.id === b.owner_id)?.name || '';
      } else if (sortCol === 'stage') {
        aVal = FUNDING_STAGE_MAP[a.stage]?.name || '';
        bVal = FUNDING_STAGE_MAP[b.stage]?.name || '';
      }
      const cmp = aVal < bVal ? -1 : aVal > bVal ? 1 : 0;
      return sortAsc ? cmp : -cmp;
    });
  }, [deals, searchQuery, sortCol, sortAsc, data]);

  const handleSort = (col) => {
    if (sortCol === col) {
      setSortAsc(!sortAsc);
    } else {
      setSortCol(col);
      setSortAsc(true);
    }
  };

  const SortHeader = ({ label, col }) => (
    <th
      style={{...S.th, cursor: 'pointer', userSelect: 'none'}}
      onClick={() => handleSort(col)}
    >
      {label} {sortCol === col && (sortAsc ? '↑' : '↓')}
    </th>
  );

  return (
    <div style={{overflowX: 'auto'}}>
      <table style={S.table}>
        <thead>
          <tr>
            <SortHeader label="Investor" col="investor_name" />
            <SortHeader label="Fund" col="fund_name" />
            <SortHeader label="Round" col="round_type" />
            <SortHeader label="Amount Target" col="amount_target" />
            <SortHeader label="Valuation" col="valuation_offered" />
            <SortHeader label="Stage" col="stage" />
            <SortHeader label="Next Action" col="next_action_date" />
            <SortHeader label="Owner" col="owner_id" />
          </tr>
        </thead>
        <tbody>
          {filteredDeals.map(deal => (
            <tr
              key={deal.id}
              onClick={() => onEditDeal(deal)}
              style={{
                cursor: 'pointer',
                transition: 'background 0.2s',
                ':hover': {background: '#27272a'}
              }}
              onMouseEnter={(e) => e.currentTarget.style.background = '#27272a'}
              onMouseLeave={(e) => e.currentTarget.style.background = 'transparent'}
            >
              <td style={S.td}>{deal.investor_name}</td>
              <td style={S.td}>{deal.fund_name || '–'}</td>
              <td style={S.td}>{deal.round_type}</td>
              <td style={S.td}>{deal.amount_target ? fmtCurrency(deal.amount_target) : '–'}</td>
              <td style={S.td}>{deal.valuation_offered ? fmtCurrency(deal.valuation_offered) : '–'}</td>
              <td style={S.td}>
                <StageBadge stage={FUNDING_STAGE_MAP[deal.stage]} />
              </td>
              <td style={S.td}>
                {deal.next_action_date ? fmtDate(deal.next_action_date) : '–'}
              </td>
              <td style={S.td}>
                {data.users.find(u => u.id === deal.owner_id)?.name || '–'}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
      {filteredDeals.length === 0 && (
        <div style={{padding: '40px', textAlign: 'center', color: '#a1a1aa'}}>
          No funding deals found
        </div>
      )}
    </div>
  );
};

const FundingPage = () => {
  const { data } = useApp();
  const [view, setView] = useState('kanban'); // 'kanban' | 'list'
  const [showModal, setShowModal] = useState(false);
  const [editingDeal, setEditingDeal] = useState(null);
  const [searchQuery, setSearchQuery] = useState('');

  const deals = data.funding_deals || [];

  const stats = useMemo(() => {
    const total = deals.length;
    const totalAmount = deals
      .filter(d => d.stage !== 'closed')
      .reduce((sum, d) => sum + (d.amount_target || 0), 0);
    const hotLeads = deals.filter(d => d.stage === 'dd' || d.stage === 'term_sheet').length;
    const closed = deals.filter(d => d.stage === 'closed').length;
    return { total, totalAmount, hotLeads, closed };
  }, [deals]);

  const handleAddDeal = () => {
    setEditingDeal(null);
    setShowModal(true);
  };

  const handleEditDeal = (deal) => {
    setEditingDeal(deal);
    setShowModal(true);
  };

  const handleCloseModal = () => {
    setShowModal(false);
    setEditingDeal(null);
  };

  return (
    <div style={{padding: '24px'}}>
      <div style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '28px'}}>
        <div>
          <h1 style={{fontSize: '28px', fontWeight: '700', color: '#fafafa', margin: 0, marginBottom: '8px'}}>
            Funding Pipeline
          </h1>
          <p style={{color: '#a1a1aa', margin: 0, fontSize: '13px'}}>
            Manage investor relationships and track funding rounds
          </p>
        </div>
        <button style={S.btnPrimary} onClick={handleAddDeal}>
          <I name="plus" size={16} color="#000" style={{marginRight: '8px'}} />
          Add Deal
        </button>
      </div>

      {/* Stats Row */}
      <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '16px', marginBottom: '28px'}}>
        <div style={S.statCard}>
          <div style={S.statVal}>{stats.total}</div>
          <div style={S.statLabel}>Total Deals</div>
        </div>
        <div style={S.statCard}>
          <div style={S.statVal}>{fmtCurrency(stats.totalAmount)}</div>
          <div style={S.statLabel}>Amount Being Raised</div>
        </div>
        <div style={S.statCard}>
          <div style={S.statVal}>{stats.hotLeads}</div>
          <div style={S.statLabel}>Hot Leads (DD/Term Sheet)</div>
        </div>
        <div style={S.statCard}>
          <div style={S.statVal}>{stats.closed}</div>
          <div style={S.statLabel}>Closed Deals</div>
        </div>
      </div>

      {/* Controls */}
      <div style={{display: 'flex', gap: '16px', marginBottom: '24px', alignItems: 'center', flexWrap: 'wrap'}}>
        <SearchBar
          placeholder="Search by investor or fund name..."
          value={searchQuery}
          onChange={setSearchQuery}
          style={{flex: 1, minWidth: '200px'}}
        />
        <div style={{display: 'flex', gap: '8px', background: '#18181b', border: '1px solid #27272a', borderRadius: '6px', padding: '4px'}}>
          <button
            style={{
              ...S.btn,
              background: view === 'kanban' ? '#f97316' : 'transparent',
              color: view === 'kanban' ? '#000' : '#a1a1aa',
              padding: '8px 16px',
              borderRadius: '4px',
              fontSize: '13px'
            }}
            onClick={() => setView('kanban')}
          >
            <I name="grid" size={16} style={{marginRight: '6px'}} color={view === 'kanban' ? '#000' : '#a1a1aa'} />
            Kanban
          </button>
          <button
            style={{
              ...S.btn,
              background: view === 'list' ? '#f97316' : 'transparent',
              color: view === 'list' ? '#000' : '#a1a1aa',
              padding: '8px 16px',
              borderRadius: '4px',
              fontSize: '13px'
            }}
            onClick={() => setView('list')}
          >
            <I name="list" size={16} style={{marginRight: '6px'}} color={view === 'list' ? '#000' : '#a1a1aa'} />
            List
          </button>
        </div>
      </div>

      {/* View Content */}
      {deals.length === 0 ? (
        <EmptyState
          icon="briefcase"
          title="No funding deals yet"
          description="Start tracking investor relationships and funding rounds."
          action={{label: 'Add Your First Deal', onClick: handleAddDeal}}
        />
      ) : view === 'kanban' ? (
        <KanbanView deals={deals} searchQuery={searchQuery} onEditDeal={handleEditDeal} />
      ) : (
        <ListView deals={deals} searchQuery={searchQuery} onEditDeal={handleEditDeal} />
      )}

      {/* Modal */}
      <FundingDealModal
        deal={editingDeal}
        isOpen={showModal}
        onClose={handleCloseModal}
      />
    </div>
  );
};

// ==================== PARTNERSHIPS PIPELINE ====================

const PARTNER_TYPES = ['Channel', 'Integration', 'Referral', 'Reseller', 'Technology', 'Distribution'];

const PARTNER_STAGES = [
  { id: 'identified', name: 'Identified', color: '#6b7280', desc: 'Potential partner spotted' },
  { id: 'outreach', name: 'Outreach', color: '#8b5cf6', desc: 'Initial contact made' },
  { id: 'evaluating', name: 'Evaluating', color: '#3b82f6', desc: 'Exploring partnership fit' },
  { id: 'agreement', name: 'Agreement', color: '#f59e0b', desc: 'Terms being finalised' },
  { id: 'live', name: 'Live', color: '#10b981', desc: 'Active partnership' },
  { id: 'churned', name: 'Churned', color: '#dc2626', desc: 'Partnership ended' }
];

const PARTNER_STAGE_MAP = Object.fromEntries(PARTNER_STAGES.map(s => [s.id, s]));

const NEXT_ACTION_TYPES = ['Call', 'Email', 'Meeting', 'Follow-up'];

const PartnerStageBadge = ({ stage }) => {
  const s = PARTNER_STAGE_MAP[stage];
  if (!s) return null;
  return <span style={{ ...S.badge, background: s.color + '22', color: s.color }}>{s.name}</span>;
};

const PartnershipModal = ({ isOpen, partnership, onClose, onSave }) => {
  const { data } = useApp();
  const [form, setForm] = useState({
    partner_name: '',
    partner_type: '',
    contact_id: '',
    website: '',
    stage: 'identified',
    channel_description: '',
    next_action_date: '',
    next_action_type: 'Email',
    notes: '',
    owner_id: ''
  });

  const [errors, setErrors] = useState({});

  useEffect(() => {
    if (partnership) {
      setForm(partnership);
      setErrors({});
    } else {
      setForm({
        partner_name: '',
        partner_type: '',
        contact_id: '',
        website: '',
        stage: 'identified',
        channel_description: '',
        next_action_date: '',
        next_action_type: 'Email',
        notes: '',
        owner_id: ''
      });
      setErrors({});
    }
  }, [partnership, isOpen]);

  const handleChange = useCallback((field, value) => {
    setForm(prev => ({ ...prev, [field]: value }));
    if (errors[field]) {
      setErrors(prev => ({ ...prev, [field]: '' }));
    }
  }, [errors]);

  const validate = () => {
    const newErrors = {};
    if (!form.partner_name.trim()) newErrors.partner_name = 'Partner name required';
    if (!form.partner_type) newErrors.partner_type = 'Partner type required';
    if (!form.owner_id) newErrors.owner_id = 'Owner required';
    setErrors(newErrors);
    return Object.keys(newErrors).length === 0;
  };

  const handleSave = () => {
    if (validate()) {
      onSave(form);
    }
  };

  return (
    <Modal isOpen={isOpen} onClose={onClose} size="lg">
      <div style={{ padding: '24px' }}>
        <h2 style={{ ...S.cardTitle, marginBottom: '24px' }}>
          {partnership ? 'Edit Partnership' : 'New Partnership'}
        </h2>

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', marginBottom: '16px' }}>
          <div style={S.formGroup}>
            <label style={S.formLabel}>Partner Name *</label>
            <input
              type="text"
              style={{ ...S.formInput, borderColor: errors.partner_name ? '#dc2626' : '' }}
              value={form.partner_name}
              onChange={(e) => handleChange('partner_name', e.target.value)}
              placeholder="e.g., Acme Distribution"
            />
            {errors.partner_name && <div style={{ color: '#dc2626', fontSize: '12px', marginTop: '4px' }}>{errors.partner_name}</div>}
          </div>

          <div style={S.formGroup}>
            <label style={S.formLabel}>Type *</label>
            <SelectInput
              value={form.partner_type}
              onChange={(val) => handleChange('partner_type', val)}
              options={PARTNER_TYPES}
              error={!!errors.partner_type}
            />
            {errors.partner_type && <div style={{ color: '#dc2626', fontSize: '12px', marginTop: '4px' }}>{errors.partner_type}</div>}
          </div>
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', marginBottom: '16px' }}>
          <div style={S.formGroup}>
            <label style={S.formLabel}>Contact</label>
            <SelectInput
              value={form.contact_id}
              onChange={(val) => handleChange('contact_id', val)}
              options={data.contacts.map(c => ({ value: c.id, label: c.full_name || c.email }))}
            />
          </div>

          <div style={S.formGroup}>
            <label style={S.formLabel}>Website</label>
            <input
              type="url"
              style={S.formInput}
              value={form.website}
              onChange={(e) => handleChange('website', e.target.value)}
              placeholder="https://example.com"
            />
          </div>
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', marginBottom: '16px' }}>
          <div style={S.formGroup}>
            <label style={S.formLabel}>Stage</label>
            <SelectInput
              value={form.stage}
              onChange={(val) => handleChange('stage', val)}
              options={PARTNER_STAGES.map(s => ({ value: s.id, label: s.name }))}
            />
          </div>

          <div style={S.formGroup}>
            <label style={S.formLabel}>Owner *</label>
            <SelectInput
              value={form.owner_id}
              onChange={(val) => handleChange('owner_id', val)}
              options={data.users.map(u => ({ value: u.id, label: u.full_name || u.email }))}
              error={!!errors.owner_id}
            />
            {errors.owner_id && <div style={{ color: '#dc2626', fontSize: '12px', marginTop: '4px' }}>{errors.owner_id}</div>}
          </div>
        </div>

        <div style={S.formGroup}>
          <label style={S.formLabel}>Channel Description</label>
          <textarea
            style={{ ...S.formInput, minHeight: '80px', fontFamily: 'inherit' }}
            value={form.channel_description}
            onChange={(e) => handleChange('channel_description', e.target.value)}
            placeholder="Describe the partnership, distribution model, and benefits..."
          />
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', marginBottom: '16px' }}>
          <div style={S.formGroup}>
            <label style={S.formLabel}>Next Action Date</label>
            <input
              type="date"
              style={S.formInput}
              value={form.next_action_date}
              onChange={(e) => handleChange('next_action_date', e.target.value)}
            />
          </div>

          <div style={S.formGroup}>
            <label style={S.formLabel}>Next Action Type</label>
            <SelectInput
              value={form.next_action_type}
              onChange={(val) => handleChange('next_action_type', val)}
              options={NEXT_ACTION_TYPES}
            />
          </div>
        </div>

        <div style={S.formGroup}>
          <label style={S.formLabel}>Notes</label>
          <textarea
            style={{ ...S.formInput, minHeight: '80px', fontFamily: 'inherit' }}
            value={form.notes}
            onChange={(e) => handleChange('notes', e.target.value)}
            placeholder="Any additional notes about this partnership..."
          />
        </div>

        <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', marginTop: '24px' }}>
          <button style={S.btnSecondary} onClick={onClose}>Cancel</button>
          <button style={S.btnPrimary} onClick={handleSave}>Save Partnership</button>
        </div>
      </div>
    </Modal>
  );
};

const KanbanView = ({ partnerships, onCardClick, onCardDrop }) => {
  const handleDragOver = useCallback((e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  }, []);

  const handleDrop = useCallback((stageId, e) => {
    e.preventDefault();
    const partnerId = e.dataTransfer.getData('partnerId');
    onCardDrop(partnerId, stageId);
  }, [onCardDrop]);

  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '16px' }}>
      {PARTNER_STAGES.map(stage => {
        const stagePartnerships = partnerships.filter(p => p.stage === stage.id);
        return (
          <div key={stage.id} style={{
            background: '#18181b',
            border: '1px solid #27272a',
            borderRadius: '8px',
            padding: '16px',
            minHeight: '400px'
          }}>
            <div style={{
              display: 'flex',
              alignItems: 'center',
              gap: '8px',
              marginBottom: '16px',
              paddingBottom: '12px',
              borderBottom: `2px solid ${stage.color}`
            }}>
              <div style={{ width: '12px', height: '12px', background: stage.color, borderRadius: '50%' }} />
              <h3 style={{ margin: 0, color: '#fafafa', fontSize: '14px', fontWeight: '600' }}>{stage.name}</h3>
              <span style={{ marginLeft: 'auto', background: '#27272a', color: '#a1a1aa', padding: '2px 8px', borderRadius: '4px', fontSize: '12px' }}>
                {stagePartnerships.length}
              </span>
            </div>

            <div
              onDragOver={handleDragOver}
              onDrop={(e) => handleDrop(stage.id, e)}
              style={{ minHeight: '350px' }}
            >
              {stagePartnerships.length === 0 ? (
                <div style={{ color: '#71717a', fontSize: '12px', textAlign: 'center', paddingTop: '40px' }}>
                  Drop here
                </div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                  {stagePartnerships.map(p => (
                    <div
                      key={p.id}
                      draggable
                      onDragStart={(e) => e.dataTransfer.setData('partnerId', p.id)}
                      onClick={() => onCardClick(p)}
                      style={{
                        background: '#27272a',
                        border: '1px solid #3f3f46',
                        borderRadius: '6px',
                        padding: '12px',
                        cursor: 'grab',
                        transition: 'all 0.2s',
                        ':hover': { borderColor: stage.color, boxShadow: `0 0 12px ${stage.color}22` }
                      }}
                      onMouseEnter={(e) => {
                        e.currentTarget.style.borderColor = stage.color;
                        e.currentTarget.style.boxShadow = `0 0 12px ${stage.color}22`;
                      }}
                      onMouseLeave={(e) => {
                        e.currentTarget.style.borderColor = '#3f3f46';
                        e.currentTarget.style.boxShadow = 'none';
                      }}
                    >
                      <div style={{ fontWeight: '600', color: '#fafafa', fontSize: '14px', marginBottom: '4px' }}>
                        {p.partner_name}
                      </div>
                      <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                        <span style={{ ...S.badge, background: '#3f3f46', color: '#a1a1aa', fontSize: '11px', padding: '2px 6px' }}>
                          {p.partner_type}
                        </span>
                      </div>
                      {p.next_action_date && (
                        <div style={{ fontSize: '11px', color: '#71717a', marginTop: '8px' }}>
                          <I name="calendar" size={12} color="#71717a" style={{ marginRight: '4px' }} />
                          {fmtDate(p.next_action_date)}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
};

const ListView = ({ partnerships, onEditClick, onDeleteClick, sortBy, onSort }) => {
  const sortedPartnerships = useMemo(() => {
    const sorted = [...partnerships];
    if (sortBy === 'name') sorted.sort((a, b) => a.partner_name.localeCompare(b.partner_name));
    if (sortBy === 'type') sorted.sort((a, b) => a.partner_type.localeCompare(b.partner_type));
    if (sortBy === 'stage') sorted.sort((a, b) => {
      const stageA = PARTNER_STAGES.findIndex(s => s.id === a.stage);
      const stageB = PARTNER_STAGES.findIndex(s => s.id === b.stage);
      return stageA - stageB;
    });
    return sorted;
  }, [partnerships, sortBy]);

  const { data } = useApp();

  const getSortArrow = (column) => {
    if (sortBy !== column) return ' ↕';
    return sortBy === column ? ' ↓' : ' ↑';
  };

  return (
    <div style={{ overflowX: 'auto' }}>
      <table style={S.table}>
        <thead>
          <tr>
            <th style={S.th} onClick={() => onSort('name')} style={{ cursor: 'pointer', ...S.th }}>
              Partner {getSortArrow('name')}
            </th>
            <th style={S.th} onClick={() => onSort('type')} style={{ cursor: 'pointer', ...S.th }}>
              Type {getSortArrow('type')}
            </th>
            <th style={S.th} onClick={() => onSort('stage')} style={{ cursor: 'pointer', ...S.th }}>
              Stage {getSortArrow('stage')}
            </th>
            <th style={S.th}>Channel</th>
            <th style={S.th}>Next Action</th>
            <th style={S.th}>Owner</th>
            <th style={S.th}>Actions</th>
          </tr>
        </thead>
        <tbody>
          {sortedPartnerships.map(p => {
            const contact = data.contacts.find(c => c.id === p.contact_id);
            const owner = data.users.find(u => u.id === p.owner_id);
            return (
              <tr key={p.id}>
                <td style={S.td}>
                  <div style={{ fontWeight: '500', color: '#fafafa' }}>{p.partner_name}</div>
                  {p.website && (
                    <div style={{ fontSize: '11px', color: '#71717a', marginTop: '4px' }}>
                      <I name="link" size={10} color="#71717a" style={{ marginRight: '2px' }} />
                      {p.website}
                    </div>
                  )}
                </td>
                <td style={S.td}>
                  <span style={{ ...S.badge, background: '#3f3f46', color: '#a1a1aa', fontSize: '11px' }}>
                    {p.partner_type}
                  </span>
                </td>
                <td style={S.td}>
                  <PartnerStageBadge stage={p.stage} />
                </td>
                <td style={S.td}>
                  <div style={{ fontSize: '12px', color: '#a1a1aa', maxWidth: '150px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                    {p.channel_description || '—'}
                  </div>
                </td>
                <td style={S.td}>
                  {p.next_action_date ? (
                    <div style={{ fontSize: '12px', color: '#a1a1aa' }}>
                      <div>{fmtDate(p.next_action_date)}</div>
                      <div style={{ fontSize: '10px', color: '#71717a' }}>{p.next_action_type}</div>
                    </div>
                  ) : (
                    <div style={{ fontSize: '12px', color: '#71717a' }}>—</div>
                  )}
                </td>
                <td style={S.td}>
                  {owner ? <Avatar name={owner.full_name || owner.email} size={28} /> : <div style={{ fontSize: '12px', color: '#71717a' }}>—</div>}
                </td>
                <td style={S.td}>
                  <div style={{ display: 'flex', gap: '8px' }}>
                    <button
                      style={S.btnGhost}
                      onClick={() => onEditClick(p)}
                      title="Edit"
                    >
                      <I name="edit" size={16} color="#f97316" />
                    </button>
                    <button
                      style={S.btnGhost}
                      onClick={() => onDeleteClick(p)}
                      title="Delete"
                    >
                      <I name="trash" size={16} color="#dc2626" />
                    </button>
                  </div>
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
};

const PartnershipsPage = () => {
  const { data, addPartnership, updatePartnership, deletePartnership, addActivity, showToast } = useApp();
  const [view, setView] = useState('kanban');
  const [searchTerm, setSearchTerm] = useState('');
  const [sortBy, setSortBy] = useState('stage');
  const [isModalOpen, setIsModalOpen] = useState(false);
  const [editingPartnership, setEditingPartnership] = useState(null);
  const [deleteConfirm, setDeleteConfirm] = useState(null);

  const filteredPartnerships = useMemo(() => {
    const query = searchTerm.toLowerCase();
    return data.partnerships.filter(p =>
      p.partner_name.toLowerCase().includes(query) ||
      p.partner_type.toLowerCase().includes(query) ||
      (p.channel_description && p.channel_description.toLowerCase().includes(query)) ||
      (p.notes && p.notes.toLowerCase().includes(query))
    );
  }, [data.partnerships, searchTerm]);

  const stats = useMemo(() => {
    const total = filteredPartnerships.length;
    const live = filteredPartnerships.filter(p => p.stage === 'live').length;
    const inPipeline = filteredPartnerships.filter(p => p.stage !== 'live' && p.stage !== 'churned').length;
    const churned = filteredPartnerships.filter(p => p.stage === 'churned').length;
    return { total, live, inPipeline, churned };
  }, [filteredPartnerships]);

  const handleAddNew = useCallback(() => {
    setEditingPartnership(null);
    setIsModalOpen(true);
  }, []);

  const handleEditClick = useCallback((partnership) => {
    setEditingPartnership(partnership);
    setIsModalOpen(true);
  }, []);

  const handleModalClose = useCallback(() => {
    setIsModalOpen(false);
    setEditingPartnership(null);
  }, []);

  const handleSavePartnership = useCallback((form) => {
    if (editingPartnership) {
      updatePartnership(editingPartnership.id, form);
      showToast({ type: 'success', message: 'Partnership updated' });
      addActivity({
        type: 'partnership_update',
        description: `Updated partnership: ${form.partner_name}`,
        entity_type: 'partnership',
        entity_id: editingPartnership.id
      });
    } else {
      addPartnership(form);
      showToast({ type: 'success', message: 'Partnership added' });
      addActivity({
        type: 'partnership_create',
        description: `Created partnership: ${form.partner_name}`,
        entity_type: 'partnership'
      });
    }
    handleModalClose();
  }, [editingPartnership, updatePartnership, addPartnership, showToast, addActivity, handleModalClose]);

  const handleDeleteClick = useCallback((partnership) => {
    setDeleteConfirm(partnership);
  }, []);

  const handleConfirmDelete = useCallback(() => {
    if (deleteConfirm) {
      deletePartnership(deleteConfirm.id);
      showToast({ type: 'success', message: 'Partnership deleted' });
      addActivity({
        type: 'partnership_delete',
        description: `Deleted partnership: ${deleteConfirm.partner_name}`,
        entity_type: 'partnership',
        entity_id: deleteConfirm.id
      });
      setDeleteConfirm(null);
    }
  }, [deleteConfirm, deletePartnership, showToast, addActivity]);

  const handleCardDrop = useCallback((partnerId, newStageId) => {
    const partnership = data.partnerships.find(p => p.id === partnerId);
    if (partnership && partnership.stage !== newStageId) {
      updatePartnership(partnerId, { ...partnership, stage: newStageId });
      const stageName = PARTNER_STAGE_MAP[newStageId]?.name || newStageId;
      showToast({ type: 'success', message: `Moved to ${stageName}` });
      addActivity({
        type: 'partnership_stage_change',
        description: `Moved ${partnership.partner_name} to ${stageName}`,
        entity_type: 'partnership',
        entity_id: partnerId
      });
    }
  }, [data.partnerships, updatePartnership, showToast, addActivity]);

  return (
    <div style={{ padding: '24px' }}>
      <div style={{ marginBottom: '24px' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '16px' }}>
          <h1 style={{ ...S.cardTitle, margin: 0 }}>
            <I name="building" size={24} color="#f97316" style={{ marginRight: '8px', verticalAlign: 'middle' }} />
            Partnerships & Distribution
          </h1>
          <button style={S.btnPrimary} onClick={handleAddNew}>
            <I name="plus" size={16} color="#fff" style={{ marginRight: '6px' }} />
            Add Partnership
          </button>
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '16px', marginBottom: '24px' }}>
          <div style={S.statCard}>
            <div style={S.statVal}>{stats.total}</div>
            <div style={S.statLabel}>Total Partnerships</div>
          </div>
          <div style={S.statCard}>
            <div style={{ ...S.statVal, color: '#10b981' }}>{stats.live}</div>
            <div style={S.statLabel}>Live Partnerships</div>
          </div>
          <div style={S.statCard}>
            <div style={{ ...S.statVal, color: '#3b82f6' }}>{stats.inPipeline}</div>
            <div style={S.statLabel}>In Pipeline</div>
          </div>
          <div style={S.statCard}>
            <div style={{ ...S.statVal, color: '#dc2626' }}>{stats.churned}</div>
            <div style={S.statLabel}>Churned</div>
          </div>
        </div>

        <div style={{ display: 'flex', gap: '12px', alignItems: 'center', marginBottom: '16px' }}>
          <div style={{ flex: 1 }}>
            <SearchBar
              placeholder="Search partnerships..."
              value={searchTerm}
              onChange={setSearchTerm}
            />
          </div>
          <div style={{ display: 'flex', gap: '8px', background: '#18181b', border: '1px solid #27272a', borderRadius: '6px', padding: '4px' }}>
            <button
              style={{
                ...S.btnGhost,
                background: view === 'kanban' ? '#27272a' : 'transparent',
                color: view === 'kanban' ? '#f97316' : '#a1a1aa'
              }}
              onClick={() => setView('kanban')}
              title="Kanban view"
            >
              <I name="grid" size={18} />
            </button>
            <button
              style={{
                ...S.btnGhost,
                background: view === 'list' ? '#27272a' : 'transparent',
                color: view === 'list' ? '#f97316' : '#a1a1aa'
              }}
              onClick={() => setView('list')}
              title="List view"
            >
              <I name="list" size={18} />
            </button>
          </div>
        </div>
      </div>

      {filteredPartnerships.length === 0 ? (
        <EmptyState
          icon="building"
          title="No Partnerships Found"
          message={searchTerm ? 'Try adjusting your search' : 'Add your first partnership to get started'}
          action={!searchTerm && {
            label: 'Add Partnership',
            onClick: handleAddNew
          }}
        />
      ) : view === 'kanban' ? (
        <KanbanView
          partnerships={filteredPartnerships}
          onCardClick={handleEditClick}
          onCardDrop={handleCardDrop}
        />
      ) : (
        <ListView
          partnerships={filteredPartnerships}
          onEditClick={handleEditClick}
          onDeleteClick={handleDeleteClick}
          sortBy={sortBy}
          onSort={setSortBy}
        />
      )}

      <PartnershipModal
        isOpen={isModalOpen}
        partnership={editingPartnership}
        onClose={handleModalClose}
        onSave={handleSavePartnership}
      />

      <ConfirmModal
        isOpen={!!deleteConfirm}
        title="Delete Partnership?"
        message={`Are you sure you want to delete "${deleteConfirm?.partner_name}"? This cannot be undone.`}
        confirmText="Delete"
        onConfirm={handleConfirmDelete}
        onCancel={() => setDeleteConfirm(null)}
        isDangerous
      />
    </div>
  );
};

// ==================== MAIN APP SHELL ====================
const Sidebar=()=>{
  const{page,setPage,currentUser,logout,data}=useApp();
  const isAdmin=currentUser?.role==='admin';
  const overdueCount=data.restaurants.filter(r=>{
    if(['live','closed'].includes(r.stage)||!r.next_action_date)return false;
    return new Date(r.next_action_date)<new Date();
  }).length;

  const navItems=[
    {id:'dashboard',icon:'home',label:'Dashboard'},
    {id:'pipeline',icon:'grid',label:'Pipeline'},
    {id:'restaurants',icon:'building',label:'Restaurants',badge:overdueCount||null},
    {id:'funding',icon:'dollar',label:'Funding'},
    {id:'partners',icon:'link',label:'Partners'},
    {id:'contacts',icon:'users',label:'Contacts'},
    {id:'network',icon:'linkedin',label:'My Network'},
    {id:'targets',icon:'target',label:'Targets'},
    {id:'activities',icon:'activity',label:'Activities'},
    ...(isAdmin?[{id:'admin',icon:'settings',label:'Admin'}]:[]),
  ];

  return(
    <div style={S.sidebar}>
      <div style={S.logo}>
        <div style={S.logoText}>REMY</div>
        <div style={S.logoSub}>AI</div>
      </div>
      <nav style={S.nav}>
        {navItems.map(item=>(
          <button key={item.id} style={{...S.navItem,...(page===item.id?S.navActive:{})}} onClick={()=>setPage(item.id)}>
            <I name={item.icon} size={18}/>
            <span>{item.label}</span>
            {item.badge&&<span style={S.navBadge}>{item.badge}</span>}
          </button>
        ))}
      </nav>
      <div style={S.userArea}>
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px'}}>
          <Avatar name={currentUser?.full_name} size={32}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{currentUser?.full_name}</div>
            <div style={{fontSize:11,color:'#71717a'}}>{currentUser?.role==='admin'?'Admin':'Sales Rep'}</div>
          </div>
          <button style={{...S.btn,...S.btnGhost,padding:4}} onClick={logout} title="Sign out"><I name="logout" size={16}/></button>
        </div>
      </div>
    </div>
  );
};

const PageHeader=({title,children})=>(
  <div style={S.header}>
    <h1 style={S.pageTitle}>{title}</h1>
    <div style={{display:'flex',alignItems:'center',gap:12}}>{children}</div>
  </div>
);

const pageTitles={dashboard:'Dashboard',pipeline:'Pipeline',restaurants:'Restaurants',contacts:'Contacts',network:'My Network',targets:'Targets & Leaderboard',activities:'Activities',admin:'Admin',funding:'Funding Pipeline',partners:'Partnerships'};

const AppContent=()=>{
  const{page}=useApp();
  const pages={dashboard:Dashboard,pipeline:Pipeline,restaurants:RestaurantsList,contacts:ContactsPage,network:LinkedInPage,targets:TargetsPage,activities:ActivitiesPage,admin:AdminPage,funding:FundingPage,partners:PartnershipsPage};
  const Page=pages[page]||Dashboard;
  return(
    <div style={S.main}>
      <PageHeader title={pageTitles[page]||'Dashboard'}/>
      <div style={S.content}><Page/></div>
    </div>
  );
};

const LoadingScreen=()=>(
  <div style={S.loginContainer}>
    <div style={{textAlign:'center'}} className="fade-in">
      <div style={{fontSize:48,fontWeight:800,color:'#f97316',letterSpacing:3,marginBottom:4}}>REMY</div>
      <div style={{fontSize:12,color:'#71717a',letterSpacing:6,textTransform:'uppercase',marginBottom:24}}>AI</div>
      <div style={{fontSize:14,color:'#52525b',animation:'pulse 1.5s infinite'}}>Loading...</div>
    </div>
  </div>
);

const App=()=>{
  const{currentUser,toast,loading,isOnline}=useApp();
  if(loading)return <LoadingScreen/>;
  if(!currentUser)return <LoginPage/>;
  return(
    <div style={S.app}>
      <Sidebar/>
      <AppContent/>
      <Toast toast={toast}/>
      {!isOnline&&<div style={{position:'fixed',bottom:16,right:16,background:'rgba(239,68,68,0.9)',color:'#fff',padding:'8px 16px',borderRadius:8,fontSize:12,fontWeight:600,zIndex:9999}}>Offline — using cached data</div>}
    </div>
  );
};

const Root=()=><AppProvider><App/></AppProvider>;
ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
